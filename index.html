<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RWD Sentinel — Data-Quality Anomaly Detection & Governance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RWD Sentinel — single-file prototype
   Design tokens per spec §10
   ============================================================ */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#FAFBFC;
  --line:#E2E7EB; --line-strong:#CBD3DA;
  --ink:#16242B; --ink-2:#4A5A63; --ink-3:#7A8892;
  --teal:#0E5F6E; --teal-2:#0B4E5A; --teal-tint:#E3F0F2;
  --amber:#B4791A; --amber-tint:#FBF0DC; --amber-line:#E9C77E;
  --red:#B5342B; --red-tint:#FBE7E5; --red-line:#E7A9A3;
  --purple:#5B4B9E; --purple-tint:#ECE8F6; --purple-line:#C7BCE7;
  --green:#2E7D52; --green-tint:#E1F1E7; --green-line:#A7D6BA;
  --band:#D7E7EA; --band-line:#9EC3CA;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --sh-sm:0 1px 2px rgba(16,40,48,.06),0 1px 3px rgba(16,40,48,.04);
  --sh-md:0 2px 6px rgba(16,40,48,.08),0 6px 18px rgba(16,40,48,.06);
  --r:10px; --r-sm:7px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:no-preference){*{transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s}}
.mono{font-family:var(--mono)}
a{color:var(--teal);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
header.top{grid-column:1/3;background:var(--teal);color:#fff;display:flex;align-items:center;gap:20px;padding:0 20px;height:56px;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.2px}
.brand .mk{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,#7FD6D6,#0E5F6E);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.ctx{display:flex;gap:18px;flex:1;overflow:hidden;font-size:12px}
.ctx .c{white-space:nowrap;color:rgba(255,255,255,.72)}
.ctx .c b{color:#fff;font-weight:600}
.ctx .c .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.roles{display:flex;align-items:center;gap:6px}
.roles select{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:5px 8px;font-size:12px;font-family:inherit}
.roles select option{color:#16242B}

nav.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto}
.nav-grp{margin-bottom:16px}
.nav-grp .lbl{font-size:10.5px;font-weight:700;letter-spacing:.9px;color:var(--ink-3);text-transform:uppercase;padding:0 8px 6px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--r-sm);color:var(--ink-2);font-size:13px;cursor:pointer;position:relative}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--teal-tint);color:var(--teal-2);font-weight:600}
.nav-item.sub{padding-left:26px;font-size:12.5px}
.nav-item .badge{margin-left:auto;background:var(--teal);color:#fff;font-size:10.5px;font-weight:600;border-radius:9px;padding:1px 7px;min-width:19px;text-align:center}
.nav-item.active .badge{background:var(--teal-2)}
.nav-ico{width:15px;text-align:center;opacity:.75;font-size:13px}

main{padding:22px 26px 60px;overflow-x:hidden;min-width:0}
.crumb{font-size:12px;color:var(--ink-3);margin-bottom:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--ink-3)}.crumb a:hover{color:var(--teal)}
.crumb .sep{opacity:.5}
h1.page{font-size:21px;font-weight:600;margin:0 0 3px}
.page-sub{color:var(--ink-2);font-size:13px;margin:0 0 20px;max-width:70ch}

/* ---- cards / grid ---- */
.grid{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm)}
.card.pad{padding:16px 18px}
.card-h{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.card-h .r{margin-left:auto;font-weight:400;font-size:12px;color:var(--ink-3)}
.card-b{padding:16px 18px}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.xsmall{font-size:11px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh-sm)}
.kpi .v{font-size:26px;font-weight:600;font-family:var(--mono);line-height:1.1}
.kpi .k{font-size:11.5px;color:var(--ink-3);margin-top:3px;text-transform:uppercase;letter-spacing:.4px}
.kpi .sub{font-size:11px;color:var(--ink-2);margin-top:4px}
.kpi.warn .v{color:var(--amber)} .kpi.risk .v{color:var(--red)} .kpi.gov .v{color:var(--purple)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;border:1px solid transparent;white-space:nowrap;letter-spacing:.2px}
.chip .cd{width:6px;height:6px;border-radius:50%}
.chip.teal{background:var(--teal-tint);color:var(--teal-2);border-color:#BFDDE1}.chip.teal .cd{background:var(--teal)}
.chip.amber{background:var(--amber-tint);color:var(--amber);border-color:var(--amber-line)}.chip.amber .cd{background:var(--amber)}
.chip.red{background:var(--red-tint);color:var(--red);border-color:var(--red-line)}.chip.red .cd{background:var(--red)}
.chip.purple{background:var(--purple-tint);color:var(--purple);border-color:var(--purple-line)}.chip.purple .cd{background:var(--purple)}
.chip.green{background:var(--green-tint);color:var(--green);border-color:var(--green-line)}.chip.green .cd{background:var(--green)}
.chip.grey{background:#EEF1F3;color:var(--ink-2);border-color:var(--line-strong)}.chip.grey .cd{background:var(--ink-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);border-radius:var(--r-sm);padding:7px 13px;font-size:12.5px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}.btn.pri:hover{background:var(--teal-2)}
.btn.gov{background:var(--purple);border-color:var(--purple);color:#fff}.btn.gov:hover{filter:brightness(.94)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}.btn.danger:hover{filter:brightness(.94)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--teal)}

/* tables */
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:var(--surface-2)}
.num{font-family:var(--mono)}
.pos{color:var(--green)}.neg{color:var(--red)}

/* score bars */
.scorewrap{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.sc{}
.sc .n{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .track{height:5px;background:#EBEFF2;border-radius:3px;overflow:hidden}
.sc .fill{height:100%;background:var(--teal);border-radius:3px}
.sc .fill.hi{background:var(--red)}.sc .fill.md{background:var(--amber)}
.sc .val{font-size:11px;font-family:var(--mono);color:var(--ink-2);margin-top:2px}

/* callouts */
.callout{border-radius:var(--r-sm);padding:11px 14px;font-size:12.5px;border:1px solid;display:flex;gap:9px;align-items:flex-start}
.callout .ci{font-weight:700}
.callout.amber{background:var(--amber-tint);border-color:var(--amber-line);color:#6E4B12}
.callout.red{background:var(--red-tint);border-color:var(--red-line);color:#7A211B}
.callout.purple{background:var(--purple-tint);border-color:var(--purple-line);color:#3D3270}
.callout.teal{background:var(--teal-tint);border-color:#BFDDE1;color:var(--teal-2)}
.callout.green{background:var(--green-tint);border-color:var(--green-line);color:#1E5638}

/* stepper */
.stepper{display:flex;gap:0;margin:2px 0 18px}
.step{flex:1;text-align:center;position:relative;padding:9px 4px;font-size:11.5px;color:var(--ink-3);border-bottom:2px solid var(--line)}
.step.done{color:var(--green);border-color:var(--green-line)}
.step.cur{color:var(--teal-2);border-color:var(--teal);font-weight:600}
.step .sn{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#EBEFF2;color:var(--ink-3);align-items:center;justify-content:center;font-size:10.5px;font-weight:700;margin-right:6px}
.step.done .sn{background:var(--green);color:#fff}
.step.cur .sn{background:var(--teal);color:#fff}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:9px 14px;font-size:12.5px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--teal-2);border-color:var(--teal);font-weight:600}
.tab .b{background:#EBEFF2;color:var(--ink-2);font-size:10px;border-radius:8px;padding:0 6px;margin-left:5px}

/* disclosure */
details{border:1px solid var(--line);border-radius:var(--r-sm);margin:8px 0;background:var(--surface-2)}
details summary{cursor:pointer;padding:9px 13px;font-size:12.5px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'▸';color:var(--ink-3);font-size:10px}
details[open] summary::before{content:'▾'}
details .dd{padding:2px 14px 13px;font-size:12.5px;color:var(--ink-2)}

/* pips */
.pips{display:inline-flex;gap:3px}
.pip{width:9px;height:9px;border-radius:2px;background:#E1E6EA}
.pip.on{background:var(--teal)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(16,36,43,.44);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:44px 20px;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--sh-md);max-width:720px;width:100%;overflow:hidden}
.modal.wide{max-width:900px}
.modal-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{margin:0;font-size:15px}
.modal-h .x{margin-left:auto;cursor:pointer;color:var(--ink-3);font-size:20px;line-height:1;background:none;border:none}
.modal-b{padding:18px 20px;max-height:66vh;overflow-y:auto}
.modal-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-2)}

/* toast */
.toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:9px;max-width:360px}
.toast{background:var(--ink);color:#fff;border-radius:9px;padding:11px 14px;font-size:12.5px;box-shadow:var(--sh-md);display:flex;gap:9px;align-items:flex-start}
.toast .ti{color:#7FD6D6;font-weight:700}
.toast.gov .ti{color:#C7BCE7}

/* misc */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:14px 0}
.tag{font-size:10.5px;font-family:var(--mono);color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
.pass{color:var(--green);font-weight:600}.fail{color:var(--red);font-weight:600}.partial{color:var(--amber);font-weight:600}
.foot-note{margin-top:34px;padding-top:14px;border-top:1px dashed var(--line-strong);font-size:11px;color:var(--ink-3)}
.evrow{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.evrow:last-child{border:none}
.evrow .em{font-family:var(--mono);color:var(--ink-3);white-space:nowrap;font-size:11px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden}
.seg button{background:var(--surface);border:none;border-right:1px solid var(--line);padding:5px 11px;font-size:11.5px;cursor:pointer;color:var(--ink-2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--teal);color:#fff}
.locked{opacity:.55;pointer-events:none}
.locknote{font-size:11px;color:var(--amber);display:flex;gap:5px;align-items:center;margin-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-2);margin-top:6px}
.legend .li{display:flex;gap:5px;align-items:center}
.legend .sw{width:14px;height:9px;border-radius:2px;display:inline-block}
</style>
</head>

/* ============================================================
   CHART HELPERS (hand-rolled SVG — signature expected-band motif)
   ============================================================ */
function expectedBandChart(s, opts={}){
  const W=opts.w||680, H=opts.h||230, pl=42, pr=14, pt=14, pb=26;
  const n=s.obs.length;
  const all=[...s.hi,...s.obs,...s.lo];
  const min=Math.min(...all)*0.96, max=Math.max(...all)*1.02;
  const x=i=> pl + i*(W-pl-pr)/(n-1);
  const y=v=> pt + (max-v)/(max-min)*(H-pt-pb);
  const line=(arr)=>arr.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  // band area
  const band=[...s.hi.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)),
              ...s.lo.map((v,i)=>'L'+x(n-1-i).toFixed(1)+','+y(s.lo[n-1-i]).toFixed(1))].join(' ')+' Z';
  let dots='';
  s.obs.forEach((v,i)=>{ if(v<s.lo[i]||v>s.hi[i]) dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.4" fill="var(--red)"/>`; });
  // incomplete hatch
  let hatch='';
  if(s.incompleteFrom!=null){
    const x0=x(s.incompleteFrom-0.5), x1=x(n-1)+6;
    hatch=`<rect x="${x0.toFixed(1)}" y="${pt}" width="${(x1-x0).toFixed(1)}" height="${H-pt-pb}" fill="url(#hatch)" opacity=".55"/>`;
  }
  let onset='';
  if(s.onset!=null){
    const ox=x(s.onset);
    onset=`<line x1="${ox.toFixed(1)}" y1="${pt}" x2="${ox.toFixed(1)}" y2="${H-pb}" stroke="var(--red)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="${(ox+4).toFixed(1)}" y="${pt+11}" font-size="9.5" fill="var(--red)" font-family="var(--mono)">${s.onsetLabel||'refresh boundary'}</text>`;
  }
  // y ticks
  let yt='';
  for(let k=0;k<=3;k++){ const v=min+(max-min)*k/3; const yy=y(v); yt+=`<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${(yy+3).toFixed(1)}" font-size="9" fill="var(--ink-3)" text-anchor="end" font-family="var(--mono)">${Math.round(v)}</text>`; }
  let xt='';
  s.labels.forEach((l,i)=>{ if(i%3===0||i===n-1) xt+=`<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="8.5" fill="var(--ink-3)" text-anchor="middle" font-family="var(--mono)">${l}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Observed vs expected range">
    <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--ink-3)" stroke-width="1"/></pattern></defs>
    ${yt}${hatch}
    <path d="${band}" fill="var(--band)" opacity=".75"/>
    <path d="${line(s.exp)}" fill="none" stroke="var(--band-line)" stroke-width="1.2" stroke-dasharray="3 3"/>
    ${onset}
    <path d="${line(s.obs)}" fill="none" stroke="var(--teal)" stroke-width="2"/>
    ${dots}${xt}
  </svg>`;
}
function hbars(rows, opts={}){ // rows: [label, value, max, colorClass]
  const max=opts.max||Math.max(...rows.map(r=>Math.abs(r[1])));
  return `<div style="display:flex;flex-direction:column;gap:8px">`+rows.map(r=>{
    const pct=Math.min(100,Math.abs(r[1])/max*100);
    const col=r[3]||'var(--teal)';
    return `<div style="display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:12px">
      <div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r[0]}</div>
      <div style="height:9px;background:#EEF1F3;border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${col};border-radius:4px"></div></div>
      <div class="num" style="text-align:right;color:var(--ink-2)">${r[4]||r[1]}</div></div>`;
  }).join('')+`</div>`;
}
function spark(arr,opts={}){
  const W=opts.w||90,H=opts.h||24; const min=Math.min(...arr),max=Math.max(...arr);
  const x=i=>i*W/(arr.length-1), y=v=>H-2-((v-min)/((max-min)||1))*(H-4);
  const d=arr.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><path d="${d}" fill="none" stroke="${opts.color||'var(--teal)'}" stroke-width="1.5"/></svg>`;
}
function scoreBars(score){
  const abbr={Magnitude:'Mag',Confidence:'Conf',Reach:'Reach',Persistence:'Persist',Recency:'Recency','Data-quality risk':'DQ risk'};
  return `<div class="scorewrap">`+Object.entries(score).map(([k,v])=>{
    const cls=v>=80?'hi':v>=60?'md':'';
    return `<div class="sc"><div class="n">${abbr[k]||k}</div><div class="track"><div class="fill ${cls}" style="width:${v}%"></div></div><div class="val">${v}</div></div>`;
  }).join('')+`</div>`;
}
function pips(n){ return `<span class="pips">`+[1,2,3,4,5].map(i=>`<span class="pip ${i<=n?'on':''}"></span>`).join('')+`</span>`; }

function runScan(){
  if(DSB.scanned){ toast('Scan already complete for this dataset',null,false); return; }
  DSB.scanned=true;
  const sig=FINDINGS.reduce((a,f)=>a+(f.signals||1),0);
  const ex=DSB.excluded||[];
  const scope = ex.length ? ('selected columns — excluded '+ex.map(t=>t.split('::')[1]).join(', ')+' (dependent detectors withheld)') : 'all columns';
  logAudit(`Anomaly scan ${DATA.scan.id} executed — scope: ${scope}. Consolidated ${sig} signals into ${FINDINGS.length} findings across ${DATA.families.length} families.`,'teal','System · detector '+DATA.scan.suite);
  toast('Scan complete — '+FINDINGS.length+' findings surfaced');

function openFinding(id){
  const f=FINDINGS.find(x=>x.id===id);
  if(f.developed){ go('investigation'); return; }
  // summary modal for non-developed findings
  openModal(`<div class="modal wide"><div class="modal-h"><span class="mono" style="font-weight:600">${f.id}</span><h3 style="margin-left:6px">${f.title}</h3><button class="x" onclick="closeModal()">×</button></div>
  <div class="modal-b">
    <div class="row" style="gap:6px;margin-bottom:12px">
      <span class="chip ${f.dqi?'amber':'grey'}"><span class="cd"></span>${f.dqrisk}</span>
      <span class="chip grey"><span class="cd"></span>${f.status}</span><span class="chip teal"><span class="cd"></span>${f.timing}</span></div>
    <p class="small">${f.summary}</p>
    <div class="card" style="margin:12px 0"><div class="card-b">${miniEvidenceChart(f)}</div></div>
    <h4 style="margin:14px 0 8px;font-size:13px">Priority decomposition — ${f.priority}</h4>
    ${scoreBars(f.score)}
    <p class="small muted" style="margin-top:8px;font-style:italic">${f.why||''}</p>
    ${f.origin==='reported-by-study-team'?`<div class="callout purple" style="margin-top:12px"><span class="ci">↳</span><div>Origin: reported by study team ST-198 — demonstrates the analyst-raised investigation path (${f.inv}). Remedy is a code-list update, not a vendor escalation.</div></div>`:''}
  </div>
  <div class="modal-f">
    ${f.report?`<button class="btn" onclick="closeModal();go('monitoring')">View monitoring</button>`:''}
    ${f.status==='New'&&can('edit')?`<button class="btn pri" onclick="closeModal();toast('Investigation opened from ${f.id}',null,false)">Open investigation</button>`:''}
    <button class="btn" onclick="closeModal()">Close</button>
  </div></div>`);
}
function miniEvidenceChart(f){
  // synthetic small band chart; clamp the parsed magnitude so odd units don't blow up the axis
  const base=100, mag=Math.max(-40,Math.min(40, parseFloat(f.magnitude)|| -5));
  const s={labels:['','','','','','','','','','','',''],exp:Array(12).fill(base),lo:Array(12).fill(base*0.94),hi:Array(12).fill(base*1.06),
    obs:[100,101,99,100,101,99,100,101,99,100, base*(1+mag/200), base*(1+mag/100)],onset:10,incompleteFrom:null};
  return expectedBandChart(s,{h:150});
}

function setEvMode(m){ state._evmode=m; render(); }
function toggleDrill(){
  if(!can('edit')){ toast('Read-only role cannot open row-level view','gov',false); return; }
  const ref=auditRef(); INV.rowAccess.push(ref);
  logAudit('Opened audited row-level drill-down (attributed patients, exited provider groups). Reference '+ref+'.','purple');
  toast('Row-level access logged · '+ref,'gov'); render();
}

function submitBlock(f){
  if(INV.approved) return `<div class="callout green"><span class="ci">✓</span><div>Approved by Reviewer. Live report <b class="mono">${INV.reportVersion}</b> created (immutable). <a onclick="go('reports')">Open report →</a></div></div>`;
  if(INV.submitted) return `<div class="callout purple"><span class="ci">🔒</span><div>Submitted for independent review — editing is locked. Only the Reviewer can act. <a onclick="go('investigation','review')">Go to Review tab →</a></div></div>`;
  const ready = INV.disposition && INV.causes.length>0;
  const reasons=[]; if(!INV.disposition)reasons.push('set a disposition'); if(INV.causes.length===0)reasons.push('add ≥1 cause'); if(state.role!=='analyst')reasons.push('Analyst role required');
  const ok = ready && state.role==='analyst';
  return `<div class="between">
    <div class="small muted">Submission requires: disposition set · impact complete · Analyst role. Submission locks editing.</div>
    <button class="btn pri" ${ok?'':'disabled'} onclick="submitForReview()">Submit for independent review</button>
  </div>${ok?'':`<div class="locknote">⚠ To submit: ${reasons.join(' · ')}.</div>`}`;
}
function setHyp(id,action){ const h=INV.hypotheses.find(x=>x.id===id); h.action=action; logAudit(`Hypothesis ${id} (${h.cls}) marked ${action}.`); toast(`${id} ${action}`); render(); }

function setDisp(d){ INV.disposition=d; logAudit(`Disposition set: ${d}.`); toast('Disposition: '+d); render(); }
function toggleCause(c){ const i=INV.causes.indexOf(c); if(i<0)INV.causes.push(c); else INV.causes.splice(i,1); logAudit(`Cause classification updated: ${INV.causes.join(', ')||'(none)'}.`); render(); }
function submitForReview(){
  INV.submitted=true; FINDINGS.find(f=>f.id==='ANM-0142').status='Submitted for review';

}

function stageOf(f){
  const fam=(f.family||'').toLowerCase(), lvl=f.level;
  if(fam.indexOf('schema')>=0) return 'Onboarding';
  if(fam.indexOf('freshness')>=0||fam.indexOf('latency')>=0||fam.indexOf('missing')>=0||fam.indexOf('completeness')>=0||fam.indexOf('volume')>=0) return 'Staging';
  if(fam.indexOf('cardinality')>=0||fam.indexOf('distribution')>=0||fam.indexOf('concentration')>=0||fam.indexOf('coverage')>=0||fam.indexOf('code emergence')>=0||fam.indexOf('code ')>=0) return 'Production';
  if(fam.indexOf('temporal')>=0||fam.indexOf('sequencing')>=0||fam.indexOf('referential')>=0||fam.indexOf('relationship')>=0) return 'ARD creation';
  if(lvl==='Patient'||fam.indexOf('plausibility')>=0||fam.indexOf('co-occurrence')>=0||fam.indexOf('unit')>=0||fam.indexOf('vitals')>=0||fam.indexOf('timestamp')>=0) return 'Use-case application';
  return 'Production';
}

  {stage:'Onboarding', sev:'red', risk:'Hard structural pipeline breaks', target:'Schema & mapping non-compliance', action:'Reject the initial load; update mapping', link:['vendor','Vendor Management']},
  {stage:'Staging', sev:'red', risk:'Production data pollution', target:'Batch volumes, file sizes, null spikes', action:'Quarantine the batch; alert the engineer', link:['refreshes','Dataset Refreshes']},
  {stage:'Production', sev:'amber', risk:'Creeping data erosion over time', target:'Distribution drift, code-frequency shifts', action:'Trigger an upstream data-governance review', link:['refreshes','Release decision']},
  {stage:'ARD creation', sev:'red', risk:'Silent pipeline logic / SQL bugs', target:'Attrition rates, temporal-logic breaks', action:'Fail the build; block analyst access', link:['investigations','Investigations']},
  {stage:'Use-case application', sev:'amber', risk:'Hallucinated ML / analytics results', target:'Input feature-vector outlier status', action:'Bypass inference; route to manual review', link:['study-impact','Study Impact']}
];

    <div class="callout teal" style="margin-top:6px"><span class="ci">Level × property</span><div>Every finding is tagged with its <b>detection level</b> (where the check runs) and its <b>affected property</b> (what quality dimension is at risk) — the two axes to navigate by. <span style="color:var(--green)">Green</span> = a check this dataset is actively surfacing; grey = recognised but not yet detecting here.</div></div>

<!-- ============================================================
     PIPELINE INTEGRATION — Synthea RWD unsupervised anomaly scan

<script src="pipeline_findings.js?v=8"></script>
<script>
(function(){
  if(!window.SYN_FINDINGS){ console.warn('pipeline_findings.js not loaded'); return; }

  // 1) Build meta by cloning the claims meta so every meta-dependent screen has a
  //    complete shape, then deep-merge the pipeline's Synthea-accurate metadata over
  //    it (identity, readiness, profile, cohort definition) so nothing is placeholder.
  var meta = JSON.parse(JSON.stringify(CLAIMS_DATA));
  var SM = window.SYN_META || {};
  Object.keys(SM).forEach(function(k){
    meta[k] = (SM[k] && typeof SM[k]==='object' && !Array.isArray(SM[k]))
      ? Object.assign({}, meta[k], SM[k])   // merge sub-object (keep any field we didn't override)
      : SM[k];                              // replace arrays / scalars outright
  });
  meta.families = window.SYN_FAMILIES;

  // 2) Register the dataset — the switcher lists Object.keys(DATASETS) automatically.
  DATASETS['SYN-001'] = {
    scanned:true, meta:meta, findings:window.SYN_FINDINGS,
    releases:[], studies:[], tickets:[], bias:[], inv:null,
    audit:(window.SYN_AUDIT||[])
  };

  // strip SNOMED-style category tags so notes read like plain English
  function cleanNote(s){
    return String(s||'').replace(/\s*\((disorder|procedure|situation|finding|regime\/therapy|environment|morphologic abnormality|substance|qualifier value)\)/gi,'');
  }
  var sevOf = function(f){ return /Confirmed/.test(f.dqrisk)?'red':/Likely/.test(f.dqrisk)?'amber':'teal'; };

  // which raw columns each kind implicates (for the raw-records view + export)
  function synKindCols(kind){
    var k=String(kind).toLowerCase();
    if(k.indexOf('bill')>=0) return ['Billed'];
    if(k.indexOf('procedures on one')>=0) return ['Lines'];
    if(k.indexOf('note')>=0) return ['Note','Visit type'];
    if(k.indexOf('age')>=0) return ['Age','Note'];
    return ['Multiple'];
  }
  // flatten every finding's evidence into one raw-record table, most unusual first
  function synFlaggedRows(){
    var rows=[];
    (window.SYN_FINDINGS||[]).forEach(function(f){ (f.evidence||[]).forEach(function(e){
      rows.push({claim:e.claim_id, cls:e.cls, age:e.age, billed:e.billed, nproc:e.nproc,
        note:cleanNote(e.note), score:e.score, kind:f.kind, nature:f.nature, property:f.property,
        finding:f.id, cols:synKindCols(f.kind), reason:e.reason});
    });});
    return rows.sort(function(a,b){ return b.score-a.score; });
  }
  function setSynView(v){ state.synView=v; render(); }
  // raw-dataset view: one row per flagged record, offending columns highlighted
  function synRecordsTable(){
    var rows=synFlaggedRows();

     + '<div style="overflow-x:auto"><table class="ev-tbl" style="width:100%;border-collapse:collapse;font-size:12px">'

         return '<tr>'

          + '<td style="'+fh(r,'Visit type')+'">'+r.cls+'</td>'

          + '<td style="'+fh(r,'Billed','text-align:right;')+'">$'+Number(r.billed).toLocaleString()+'</td>'
          + '<td style="'+fh(r,'Lines','text-align:right;')+'">'+r.nproc+'</td>'
          + '<td style="padding:6px 8px;text-align:right">'+r.score.toFixed(2)+'</td>'
          + '<td style="'+fh(r,'Note','max-width:34ch;font-size:11.5px;')+'" class="'+(r.cols.indexOf('Note')>=0?'':'muted')+'">'+r.note+'</td>'

  // ---- export ----

  }

  function exportFlaggedCSV(){

     +'<h1>Anomaly scan report — Synthea RWD (SYN-001)</h1>'
     +'<div class="muted">Generated '+esc(nowStamp())+' · synthetic data (MITRE Synthea) · illustrative only.</div>'

     +'<li>'+breached+' of '+F.length+' checks breached their expected background band and were promoted to findings.</li>'
     +'<li>By affected property: '+Object.keys(byProp).map(function(k){return esc(k)+' '+byProp[k];}).join(' · ')+'.</li></ul>'

     + F.map(function(f){ return '<tr><td>'+esc(f.kind)+'</td><td>'+esc(f.nature)+'</td><td>'+esc(f.property)+'</td><td>'+f.signals+'</td><td>'+f.flagRate+'%</td><td>'+(f.breached?'Yes':'No — within background')+'</td></tr>'; }).join('')
     +'</tbody></table>'
     +'<h2>Flagged records ('+rows.length+')</h2><table><thead><tr><th>Claim</th><th>Visit</th><th>Age</th><th>Billed</th><th>Lines</th><th>Kind</th><th>Flagged columns</th><th>Note</th></tr></thead><tbody>'
     + rows.map(function(r){ var h=function(c,v){return '<td'+(r.cols.indexOf(c)>=0?' class="hl"':'')+'>'+esc(v)+'</td>';};
         return '<tr><td>'+esc(r.claim.slice(0,8))+'…</td>'+h('Visit type',r.cls)+h('Age',r.age)+h('Billed','$'+r.billed)+h('Lines',r.nproc)+'<td>'+esc(r.kind)+'</td><td>'+esc(r.cols.join(', '))+'</td><td class="muted">'+esc(r.note)+'</td></tr>'; }).join('')

  // expose the handlers referenced from inline onclick (defined inside this IIFE)

  // 3a) Re-arranged workflow for the scan: the DQ Anomalies screen opens on a

  var _origAnom = SCREENS.anomalies;

    return ''
      + '<div class="crumb"><a onclick="go(\'overview\')">Findings</a><span class="sep">/</span>Anomaly scan</div>'

     + '</div>'
     + '<div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:14px">'
     +   '<div class="card"><div class="card-h">By affected property</div><div class="card-b">'+hbars(propBars)+'</div></div>'
     +   '<div class="card"><div class="card-h">Checks → findings</div><div class="card-b"><table class="tbl"><thead><tr><th>Kind</th><th>Records</th><th>Rate</th><th>Promoted?</th></tr></thead><tbody>'
     +     F.map(function(f){return '<tr class="click" onclick="openFinding(\''+f.id+'\')"><td>'+f.kind+'</td><td class="num">'+f.signals+'</td><td class="num">'+f.flagRate+'%</td><td>'+(f.breached?'<span class="chip green"><span class="cd"></span>finding</span>':'<span class="chip grey"><span class="cd"></span>background</span>')+'</td></tr>';}).join('')
     +   '</tbody></table></div></div>'
     + '</div>'
     + '<div class="card"><div class="card-h">Flagged records <span class="r">'+rows.length+' · offending columns highlighted</span></div><div class="card-b">'+synRecordsTable()+'</div></div>';
  };

  // 3b) Plain-language drill-down: what it is, why it's flagged, what to check,
  //     then the individual claims (no jargon, no algorithm names).
  var _origOpenFinding = window.openFinding;
  window.openFinding = function(id){
    var f = FINDINGS.find(function(x){ return x.id===id; });
    if(!f || !f.evidence){ return _origOpenFinding(id); }  // narrative datasets unchanged
    var rows = f.evidence.map(function(e){
      return '<tr>'
        + '<td class="mono" style="font-weight:600" title="'+e.claim_id+'">'+e.claim_id.slice(0,8)+'…</td>'
        + '<td>'+e.cls+'</td>'
        + '<td style="text-align:right">'+e.age+'</td>'
        + '<td style="text-align:right">$'+e.billed.toLocaleString()+'</td>'
        + '<td style="text-align:right">'+e.nproc+'</td>'
        + '<td style="text-align:right"><b>'+e.score.toFixed(2)+'</b></td>'
        + '<td style="max-width:56ch;font-size:12px;color:var(--ink-2);line-height:1.5">'+(e.reason||cleanNote(e.note))+'</td>'
        + '</tr>';
    }).join('');
    var sev = sevOf(f);
    openModal('<div class="modal wide"><div class="modal-h">'
      + '<span class="mono" style="font-weight:600">'+f.id+'</span>'
      + '<h3 style="margin-left:6px">'+f.kind+'</h3>'
      + '<button class="x" onclick="closeModal()">×</button></div>'
      + '<div class="modal-b">'
      + '<div class="row" style="gap:6px;margin-bottom:12px">'
      +   (f.nature?'<span class="chip '+(f.nature==='Rule violation'?'teal':'grey')+'"><span class="cd"></span>'+f.nature+'</span>':'')
      +   (f.property?'<span class="chip teal"><span class="cd"></span>'+f.property+'</span>':'')
      +   '<span class="chip '+sev+'"><span class="cd"></span>'+f.dqrisk+'</span>'
      +   (f.category?'<span class="chip grey"><span class="cd"></span>'+f.category+' — '+({'Out-of-range value':'one field',"Conflicting fields":'two fields disagree','Unusual overall':'across many fields'}[f.category]||'')+'</span>':'')
      +   '<span class="chip grey"><span class="cd"></span>'+f.signals+' claims flagged</span></div>'
      + (f.natureNote?'<div class="callout '+(f.nature==='Rule violation'?'teal':'amber')+'" style="margin-bottom:14px"><span class="ci">'+f.nature+'</span><div>'+f.natureNote+'</div></div>':'')
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">'
      +   '<div class="callout teal"><span class="ci">What this is</span><div>'+f.what+'</div></div>'
      +   '<div class="callout amber"><span class="ci">Why it’s flagged</span><div>'+f.whyFlag+'</div></div>'
      + '</div>'
      + '<div class="callout teal" style="margin-bottom:16px"><span class="ci">What to check</span><div>'+f.check+'</div></div>'
      + '<h4 style="margin:4px 0 8px;font-size:13px">The '+f.signals+' claims — each with why it was flagged '
      +   '<span class="muted xsmall">(most unusual first · showing '+f.evidence.length+')</span></h4>'
      + '<div style="overflow-x:auto"><table class="ev-tbl" style="width:100%;border-collapse:collapse;font-size:12px">'
      +   '<thead><tr style="text-align:left;border-bottom:1px solid var(--line);color:var(--ink-3)">'
      +     '<th style="padding:6px 8px">Claim</th><th style="padding:6px 8px">Visit type</th>'
      +     '<th style="padding:6px 8px;text-align:right">Age</th><th style="padding:6px 8px;text-align:right">Billed</th>'
      +     '<th style="padding:6px 8px;text-align:right">Lines</th><th style="padding:6px 8px;text-align:right">Unusualness</th>'
      +     '<th style="padding:6px 8px">Why this record was flagged</th></tr></thead>'
      +   '<tbody>'+rows+'</tbody></table></div>'
      + '<p class="small muted" style="margin-top:10px;font-style:italic">These are the individual claims that triggered this kind, most unusual first (0–1 scale). '
      +   'A flag is a suspected data issue to confirm — not a confirmed error.</p>'
      + '</div><div class="modal-f"><button class="btn" onclick="closeModal()">Close</button></div></div>');
  };

  // style hook: zebra rows for the evidence table
  var st=document.createElement('style');
  st.textContent='.ev-tbl tbody tr{border-bottom:1px solid var(--line)}'
    +'.ev-tbl tbody tr:hover{background:var(--surface-2)}'
    +'.ev-tbl td{padding:6px 8px;vertical-align:top}';
  document.head.appendChild(st);

  render(); // refresh so the dataset dropdown shows SYN-001
  console.log('[pipeline] registered SYN-001 with', window.SYN_FINDINGS.length,
              'findings ·', (window.SYN_SUMMARY||{}).scanned, 'claims scanned');
})();
</script>
</body>
</html>
