<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RWD Sentinel — Data-Quality Anomaly Detection & Governance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
/* ==== rwd_model.js (inlined for single-file portability) ==== */
/* ============================================================
   RWD ARCHITECTURE MODEL  (lifecycle spine + 3 detection layers)
   Injected after the base app + pipeline_findings.js.
   ============================================================ */

/* ---- 3 detection layers ---- */
const LAYERS = {
  pipeline:{ id:'pipeline', n:'Pipeline', full:'Pipeline-Level (Metadata)', ico:'▤',
    blurb:'System-level failures caught before data reaches analytics: ingestion volume, freshness/latency, and schema drift.',
    detectors:['Volume forecasting','Freshness & latency','Schema drift'] },
  entity:{ id:'entity', n:'Entity', full:'Entity & Feature-Level (Aggregate)', ico:'◫',
    blurb:'Statistical distribution of clinical concepts across the whole population: missingness spikes, code-cardinality shifts (PSI / χ²), cross-table referential integrity.',
    detectors:['Null & missingness spikes','Code cardinality shift (PSI/χ²)','Cross-table referential integrity'] },
  patient:{ id:'patient', n:'Patient', full:'Patient-Level Longitudinal (Clinical)', ico:'♥',
    blurb:'Per-patient clinical plausibility and sequencing: illogical timelines, co-occurrence contradictions, and biomedical boundary checks (age/sex-tailored IQR / Z-score).',
    detectors:['Longitudinal sequencing','Clinical co-occurrence implausibility','Biomedical boundary checks'] },
};
const LAYER_ORDER=['pipeline','entity','patient'];
const LOCK_SVG=(sz=12)=>'<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="vertical-align:-2px" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>';

/* ---- family -> layer map (existing families across both datasets) ---- */
const FAMILY_LAYER = {
  // pipeline
  'Volume':'pipeline','Encounter volume':'pipeline','Latency':'pipeline','Result latency':'pipeline',
  'Timestamp integrity':'pipeline','Schema drift':'pipeline','Freshness & latency':'pipeline','Volume forecasting':'pipeline',
  // entity
  'Missingness':'entity','Distribution shift':'entity','Code emergence/dropout':'entity','Concentration':'entity',
  'Provider/source coverage':'entity','Site/source coverage':'entity','Lab completeness':'entity',
  'Demographic completeness':'entity','Terminology drift':'entity','Trend break':'entity',
  'Null & missingness spikes':'entity','Code cardinality shift':'entity','Cross-table referential integrity':'entity',
  'Segment divergence':'entity','Relationship change':'entity',
  // patient
  'Lab unit & value plausibility':'patient','Vitals plausibility':'patient','Medication order integrity':'patient',
  'Longitudinal sequencing':'patient','Clinical co-occurrence implausibility':'patient','Biomedical boundary checks':'patient',
};
function layerOf(f){ return FAMILY_LAYER[f && f.family] || FAMILY_LAYER[f] || 'entity'; }

/* Which named detector/check surfaced a given family (for the detections ledger). */
const FAMILY_DETECTOR = {
  'Volume':'Volume forecasting','Encounter volume':'Volume forecasting','Volume forecasting':'Volume forecasting',
  'Latency':'Freshness & latency','Result latency':'Freshness & latency','Freshness & latency':'Freshness & latency','Timestamp integrity':'Freshness & latency',
  'Schema drift':'Schema drift',
  'Missingness':'Null & missingness spikes','Lab completeness':'Null & missingness spikes','Demographic completeness':'Null & missingness spikes','Null & missingness spikes':'Null & missingness spikes',
  'Distribution shift':'Code cardinality shift (PSI/χ²)','Code emergence/dropout':'Code cardinality shift (PSI/χ²)','Terminology drift':'Code cardinality shift (PSI/χ²)','Trend break':'Code cardinality shift (PSI/χ²)','Code cardinality shift':'Code cardinality shift (PSI/χ²)','Concentration':'Code cardinality shift (PSI/χ²)','Segment divergence':'Code cardinality shift (PSI/χ²)',
  'Provider/source coverage':'Cross-table referential integrity','Site/source coverage':'Cross-table referential integrity','Cross-table referential integrity':'Cross-table referential integrity','Relationship change':'Cross-table referential integrity',
  'Longitudinal sequencing':'Longitudinal sequencing',
  'Clinical co-occurrence implausibility':'Clinical co-occurrence implausibility',
  'Lab unit & value plausibility':'Biomedical boundary checks','Vitals plausibility':'Biomedical boundary checks','Biomedical boundary checks':'Biomedical boundary checks','Medication order integrity':'Biomedical boundary checks',
};
function detectorOf(f){ return FAMILY_DETECTOR[f && f.family] || FAMILY_DETECTOR[f] || (f&&f.family) || '—'; }

/* ============================================================
   CHECK RESULTS — the actual measured output of each detector,
   with a small visual spec. Observational values only.
   viz types: 'band' (obs vs expected series) | 'gauge' (value vs threshold) | 'delta' (before→after) | 'bars' (category counts)
   ============================================================ */
const CHECK_RESULTS = {
  'ANM-0142':{ metric:'Outpatient encounters / 1,000', observed:'−21.3%', expected:'0% ±6%', stat:'z = −4.8', viz:{type:'band',
    labels:['Nov','Dec','Jan','Feb','Mar','Apr'], exp:[100,100,100,100,100,100], lo:[94,94,94,94,94,94], hi:[106,106,106,106,106,106],
    obs:[101,99,100,93,86,79], onset:3, onsetLabel:'v2026.06', unit:'index (100 = expected)'} },
  'ANM-0145':{ metric:'POS field completeness', observed:'82.4%', expected:'≥ 97%', stat:'−15.1pp', viz:{type:'gauge', value:82.4, min:0, max:100, threshold:97, dir:'min', unit:'%'} },
  'ANM-0147':{ metric:'Member-months (denominator)', observed:'−2.5%', expected:'0% ±1%', stat:'z = −3.1', viz:{type:'delta', before:100, after:97.5, unit:'index'} },
  'ANM-0151':{ metric:'Schema conformance', observed:'3 columns changed', expected:'0 changes', stat:'+2 added / −1 dropped', viz:{type:'bars', rows:[['Added',2,'var(--amber)'],['Dropped',1,'var(--red)'],['Renamed',0,'var(--ink-3)']], unit:'columns'} },
  'ANM-0152':{ metric:'Fill→ingestion latency (p95)', observed:'11 days', expected:'≤ 3 days', stat:'+8 days', viz:{type:'gauge', value:11, min:0, max:14, threshold:3, dir:'max', unit:'days'} },
  'ANM-0153':{ metric:'Orphan script rate', observed:'1.7% (2,410)', expected:'0%', stat:'2,410 orphans', viz:{type:'gauge', value:1.7, min:0, max:3, threshold:0, dir:'max', unit:'%'} },
  'ANM-0154':{ metric:'Dx code distribution (PSI)', observed:'PSI 0.24', expected:'PSI < 0.20', stat:'−18% distinct codes', viz:{type:'gauge', value:0.24, min:0, max:0.4, threshold:0.20, dir:'max', unit:'PSI'} },
  'ANM-0155':{ metric:'Death-before-event violations', observed:'318 patients', expected:'0', stat:'318 records', viz:{type:'gauge', value:318, min:0, max:400, threshold:0, dir:'max', unit:'patients'} },
  'ANM-0156':{ metric:'Sex–diagnosis contradictions', observed:'54 patients', expected:'0', stat:'C61 on sex=F', viz:{type:'gauge', value:54, min:0, max:80, threshold:0, dir:'max', unit:'patients'} },
  'ANM-0157':{ metric:'Systolic BP plausibility', observed:'41 records > 300 mmHg', expected:'0', stat:'max 800 mmHg', viz:{type:'bars', rows:[['300–400',22,'var(--amber)'],['400–600',13,'var(--red)'],['>600',6,'var(--red)']], unit:'records'} },
};
/* Fallback: derive a minimal result from a finding's own fields when no explicit check is authored. */
function checkResult(f){
  if(CHECK_RESULTS[f.id]) return CHECK_RESULTS[f.id];
  return { metric:f.measure||detectorOf(f), observed:f.magnitude||'—', expected:'expected range', stat:f.timing||'', viz:null };
}
function miniBand(v, w=150, h=44){
  return expectedBandChart({labels:v.labels,exp:v.exp,lo:v.lo,hi:v.hi,obs:v.obs,onset:v.onset,onsetLabel:v.onsetLabel},{w,h});
}
function gaugeViz(v, w=170){
  const H=30, pad=2, span=v.max-v.min;
  const px=x=>pad+((x-v.min)/span)*(w-2*pad);
  const tx=px(v.threshold), vx=px(v.value);
  const over = v.dir==='max' ? v.value>v.threshold : v.value<v.threshold;
  const col= over? 'var(--red)':'var(--green)';
  // filled portion up to value
  return `<svg viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" role="img" aria-label="${v.metric||''} ${v.value}${v.unit||''}, threshold ${v.threshold}">
    <rect x="${pad}" y="11" width="${w-2*pad}" height="8" rx="4" fill="#EEF1F3"/>
    <rect x="${pad}" y="11" width="${Math.max(0,vx-pad).toFixed(1)}" height="8" rx="4" fill="${col}" opacity=".85"/>
    <line x1="${tx.toFixed(1)}" y1="6" x2="${tx.toFixed(1)}" y2="24" stroke="var(--ink-2)" stroke-width="1.4" stroke-dasharray="2 2"/>
    <text x="${tx.toFixed(1)}" y="5" font-size="8" fill="var(--ink-3)" text-anchor="middle" font-family="var(--mono)">thr ${v.threshold}${v.unit==='%'||v.unit==='PSI'?'':''}</text>
    <circle cx="${vx.toFixed(1)}" cy="15" r="4" fill="${col}"/>
  </svg>`;
}
function miniBars(v, w=170){
  const rows=v.rows, max=Math.max(...rows.map(r=>r[1]))||1;
  return `<div style="display:flex;flex-direction:column;gap:4px;width:${w}px">`+rows.map(r=>`
    <div style="display:grid;grid-template-columns:56px 1fr 34px;gap:6px;align-items:center;font-size:10.5px">
      <span class="muted mono">${r[0]}</span>
      <span style="height:8px;background:#EEF1F3;border-radius:3px;overflow:hidden"><span style="display:block;height:100%;width:${(r[1]/max*100).toFixed(0)}%;background:${r[2]}"></span></span>
      <span class="num mono" style="text-align:right">${r[1]}</span></div>`).join('')+`</div>`;
}
function deltaViz(v, w=150){
  const H=40, y=18, x0=8, x1=w-8;
  return `<svg viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" role="img" aria-label="before ${v.before} to after ${v.after}">
    <circle cx="${x0}" cy="${y}" r="4" fill="var(--ink-3)"/><text x="${x0}" y="${y+16}" font-size="8.5" fill="var(--ink-3)" text-anchor="middle" font-family="var(--mono)">${v.before}</text>
    <line x1="${x0+6}" y1="${y}" x2="${x1-6}" y2="${y}" stroke="var(--line-strong)" stroke-width="1.4" marker-end="url(#arr)"/>
    <circle cx="${x1}" cy="${y}" r="4" fill="var(--red)"/><text x="${x1}" y="${y+16}" font-size="8.5" fill="var(--red)" text-anchor="middle" font-family="var(--mono)">${v.after}</text>
    <defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--line-strong)"/></marker></defs>
  </svg>`;
}
function checkViz(f, w){
  const v=(CHECK_RESULTS[f.id]||{}).viz; if(!v) return '';
  if(v.type==='band') return miniBand(v, w||190, 52);
  if(v.type==='gauge') return gaugeViz({...v,metric:f.measure}, w||180);
  if(v.type==='bars') return miniBars(v, w||180);
  if(v.type==='delta') return deltaViz(v, w||150);
  return '';
}

/* ============================================================
   NORMS & SPREAD — what "normal" looks like in this dataset,
   and where the flagged value sits within it. Box-plot ready.
   stats: {min,q1,med,q3,max, unit, flagged, flagLabel, normLabel}
   ============================================================ */
const NORMS = {
  'ANM-0142':{ metric:'Outpatient encounters / 1,000 members', unit:'', min:88, q1:96, med:100, q3:104, max:112,
    flagged:79, flagLabel:'Feb–Apr 2026', normLabel:'24 prior months', n:'24 mo' },
  'ANM-0145':{ metric:'POS field completeness', unit:'%', min:95.8, q1:97.1, med:97.6, q3:98.2, max:99.1,
    flagged:82.4, flagLabel:'v2026.06', normLabel:'prior releases', n:'18 releases' },
  'ANM-0147':{ metric:'Member-months / member', unit:'', min:11.4, q1:11.8, med:12.0, q3:12.2, max:12.6,
    flagged:11.7, flagLabel:'current', normLabel:'rolling baseline', n:'12 mo' },
  'ANM-0152':{ metric:'Fill→ingestion latency (days)', unit:'d', min:1.2, q1:2.1, med:2.6, q3:3.0, max:3.6,
    flagged:11.0, flagLabel:'2026-06 p95', normLabel:'prior p95', n:'12 mo' },
  'ANM-0153':{ metric:'Orphan script rate', unit:'%', min:0.0, q1:0.0, med:0.02, q3:0.05, max:0.11,
    flagged:1.7, flagLabel:'v2026.06', normLabel:'prior loads', n:'18 loads' },
  'ANM-0154':{ metric:'ICD-10 distribution PSI', unit:'', min:0.01, q1:0.03, med:0.05, q3:0.08, max:0.14,
    flagged:0.24, flagLabel:'2026-04→06', normLabel:'rolling PSI', n:'12 windows' },
  'ANM-0157':{ metric:'Systolic BP (mmHg)', unit:'', min:86, q1:112, med:122, q3:134, max:180,
    flagged:800, flagLabel:'flagged max', normLabel:'plausible range', n:'population', clampNote:'physiologic ceiling ≈ 300' },
};
function normOf(f){ return NORMS[f.id]||null; }

/* Stage-level confidence stats (records evaluated, coverage). */
const STAGE_STATS_DS = {
  'DSN-114':{ onboarding:{records:'3.91M',coverage:'100% of columns'}, staging:{records:'184K',coverage:'current batch'}, production:{records:'3.91M',coverage:'12-month window'}, ard:{records:'1.34M',coverage:'analysis cohort'}, usecase:{records:'48K',coverage:'model input rows'} },
  'EHR-207':{ onboarding:{records:'11.28M',coverage:'100% of columns'}, staging:{records:'642K',coverage:'current batch'}, production:{records:'11.28M',coverage:'12-month window'}, ard:{records:'2.14M',coverage:'analysis cohort'}, usecase:{records:'84K',coverage:'model input rows'} },
  'SYN-001':{ onboarding:{records:'5,473',coverage:'100% of columns'}, staging:{records:'5,473',coverage:'current batch'}, production:{records:'5,473',coverage:'full history'}, ard:{records:'1,912',coverage:'analysis cohort'}, usecase:{records:'1,912',coverage:'model input rows'} },
};
function stageStatsFor(sid){ return (STAGE_STATS_DS[state.dataset]||{})[sid]||{}; }
const STAGE_STATS = new Proxy({}, { get:(_,sid)=>stageStatsFor(sid) });
/* Per-detector clean-result stats — the measured result of a passing check, with a
   numeric value / threshold so the clean outcome is shown, not asserted.
   viz.type: 'gauge' (value vs threshold) | 'box' (value within a normal range) */
const CLEAN_STATS = {
  'Volume forecasting':{ checked:'12 monthly batches', metric:'Max monthly deviation from forecast', observed:'+3.8%', expected:'within ±6%', margin:'2.2pp headroom',
    viz:{type:'gauge', value:3.8, min:0, max:8, threshold:6, dir:'max', unit:'%'} },
  'Freshness & latency':{ checked:'all incoming files', metric:'Ingestion latency (p95)', observed:'2.6 days', expected:'≤ 3 days', margin:'0.4d headroom',
    viz:{type:'gauge', value:2.6, min:0, max:5, threshold:3, dir:'max', unit:'d'} },
  'Schema drift':{ checked:'all columns vs contract', metric:'Columns changed vs contract', observed:'0', expected:'0', margin:'exact match',
    viz:{type:'gauge', value:0, min:0, max:5, threshold:1, dir:'max', unit:''} },
  'Null & missingness spikes':{ checked:'all fields', metric:'Peak null-rate z-score', observed:'1.1σ', expected:'< 2σ', margin:'0.9σ headroom',
    viz:{type:'gauge', value:1.1, min:0, max:3, threshold:2, dir:'max', unit:'σ'} },
  'Code cardinality shift (PSI/χ²)':{ checked:'Dx / Rx / CPT distributions', metric:'Population Stability Index (max)', observed:'0.09', expected:'PSI < 0.20', margin:'0.11 headroom',
    viz:{type:'gauge', value:0.09, min:0, max:0.4, threshold:0.20, dir:'max', unit:''} },
  'Cross-table referential integrity':{ checked:'all cross-table keys', metric:'Orphaned foreign keys', observed:'0', expected:'0', margin:'exact match',
    viz:{type:'gauge', value:0, min:0, max:100, threshold:1, dir:'max', unit:''} },
  'Longitudinal sequencing':{ checked:'per-patient timelines', metric:'Impossible event sequences', observed:'0', expected:'0', margin:'exact match',
    viz:{type:'gauge', value:0, min:0, max:50, threshold:1, dir:'max', unit:''} },
  'Clinical co-occurrence implausibility':{ checked:'sex / age vs diagnosis', metric:'Contradictory records', observed:'0', expected:'0', margin:'exact match',
    viz:{type:'gauge', value:0, min:0, max:50, threshold:1, dir:'max', unit:''} },
  'Biomedical boundary checks':{ checked:'labs & vitals', metric:'Values outside physiologic bounds', observed:'0', expected:'0', margin:'exact match',
    viz:{type:'gauge', value:0, min:0, max:50, threshold:1, dir:'max', unit:''} },
};
function cleanViz(d, w){ const cs=CLEAN_STATS[d]; if(!cs||!cs.viz) return ''; const v=cs.viz;
  if(v.type==='gauge') return gaugeViz({...v,metric:cs.metric}, w||190);
  return ''; }

/* ============================================================
   CHECK DETAIL — third drill-down level: exactly what each check
   evaluated (columns, items, per-item statistics).
   Opened by clicking any detector row. Item schemas vary by check.
   ============================================================ */
function dsCols(dsId){ const D=INSPECT_DATA[dsId]; return D?D.cols:[]; }
function dsFile(dsId){ const D=INSPECT_DATA[dsId]; return D?D.file:'—'; }
const CODE_SYSTEMS={ 'DSN-114':['ICD-10-CM (dx_primary)','NDC (pharmacy feed)','CPT/HCPCS (procedure feed)'],
  'EHR-207':['LOINC (loinc)','ICD-10-CM (problem list)'], 'SYN-001':['SNOMED CT (code)','RxNorm (medications)'] };
const KEY_PAIRS={ 'DSN-114':[['pharmacy.member_id → enrollment.member_id','2,410 orphans (1.7%)','flag'],['claims.member_id → enrollment.member_id','0 orphans','pass'],['claims.npi → provider_registry.npi','0 orphans','pass']],
  'EHR-207':[['lab_results.patient_id → demographics.patient_id','0 orphans','pass'],['lab_results.site_id → site_master.site_id','0 orphans','pass']],
  'SYN-001':[['claims.patient_id → patients.patient_id','0 orphans','pass']] };
const MONTH_DEVS=[['2025-07','+0.6%'],['2025-08','−1.2%'],['2025-09','+2.1%'],['2025-10','−0.8%'],['2025-11','+1.4%'],['2025-12','−2.3%'],['2026-01','+0.9%'],['2026-02','−1.6%'],['2026-03','+3.8%'],['2026-04','+2.4%'],['2026-05','−0.4%'],['2026-06','+1.1%']];
function nullRateFor(c,i){ return (0.2 + ((c.length*7+i*13)%17)/10).toFixed(1); }

const CHECK_DETAIL = {
  'Volume forecasting':{
    method:'Monthly record counts are compared against a seasonal forecast fitted on a 24-month baseline (STL decomposition). A batch is flagged when its deviation exceeds ±6% of forecast.',
    scope:(ds)=>['row count per monthly batch','file: '+dsFile(ds)],
    cols:['Batch','Deviation vs forecast','Limit','Status'],
    items:(ds)=>MONTH_DEVS.map(([m,d])=>[m,d,'±6%',Math.abs(parseFloat(d.replace('−','-')))<=6?'pass':'flag']),
  },
  'Freshness & latency':{
    method:'Per-file lag from source event date to warehouse ingestion timestamp. Distribution computed per feed; the p95 statistic is tested against the 3-day contract SLA.',
    scope:(ds)=>['event date → ingestion timestamp','all files in current window'],
    cols:['Feed','p50','p95','Max','SLA','Status'],
    items:(ds)=> ds==='DSN-114'
      ? [['medical claims','1.1d','2.6d','2.9d','≤ 3d','pass'],['enrollment','0.9d','1.8d','2.2d','≤ 3d','pass'],['provider registry','1.4d','2.4d','2.8d','≤ 3d','pass']]
      : ds==='EHR-207'
      ? [['lab results','0.8d','2.1d','2.7d','≤ 3d','pass'],['encounters','1.0d','2.5d','2.9d','≤ 3d','pass']]
      : [['synthetic claims','0.2d','0.4d','0.6d','≤ 3d','pass']],
  },
  'Schema drift':{
    method:'Every column in the delivered file is compared to the vendor data contract: presence, name, declared type, and nullability. Any addition, drop, or type change is flagged.',
    scope:(ds)=>['all columns vs contract','file: '+dsFile(ds)],
    cols:['Column','Contract type','Observed','Status'],
    items:(ds)=>dsCols(ds).map(c=>[c, c.includes('_id')?'string (key)':c.includes('date')||c.includes('_dt')?'date/timestamp':c.includes('amt')||c.includes('cost')||c==='value'?'decimal':'string','matches contract','pass']),
  },
  'Null & missingness spikes':{
    method:'Per-column null rate for the current load is tested against a per-column control limit (baseline mean + 2σ over trailing 12 loads).',
    scope:(ds)=>['null rate per column, current load vs 12-load baseline'],
    cols:['Column','Null rate (current)','Control limit','Status'],
    items:(ds)=>dsCols(ds).map((c,i)=>[c, nullRateFor(c,i)+'%', (parseFloat(nullRateFor(c,i))+1.4).toFixed(1)+'%','pass']),
  },
  'Code cardinality shift (PSI/χ²)':{
    method:'Code-frequency distributions for each vocabulary are compared to the trailing 12-month baseline using the Population Stability Index; χ² test applied to the top-200 codes. PSI ≥ 0.20 is flagged.',
    scope:(ds)=>(CODE_SYSTEMS[ds]||['primary code fields']),
    cols:['Code system','PSI','χ² p-value','Limit','Status'],
    items:(ds)=>(CODE_SYSTEMS[ds]||['codes']).map((cs,i)=>[cs,(0.04+i*0.025).toFixed(2),(0.31+i*0.12).toFixed(2),'PSI < 0.20','pass']),
  },
  'Cross-table referential integrity':{
    method:'Every foreign-key relationship in the delivery is joined against its parent table; unmatched (orphaned) keys are counted per relationship.',
    scope:(ds)=>['all declared key relationships'],
    cols:['Relationship','Orphans','Expected','Status'],
    items:(ds)=>(KEY_PAIRS[ds]||[]).map(([r,o,st])=>[r,o,'0',st]),
  },
  'Longitudinal sequencing':{
    method:'Per-patient event timelines are assembled and tested against impossible-order rules (events after death, discharge before admission, overlapping exclusive stays).',
    scope:(ds)=>['per-patient event ordering, all clinical events'],
    cols:['Rule','Violations','Expected','Status'],
    items:(ds)=>[['event dated after death','0','0','pass'],['discharge before admission','0','0','pass'],['prescription fill after death','0','0','pass'],['overlapping inpatient stays','0','0','pass']],
  },
  'Clinical co-occurrence implausibility':{
    method:'Diagnosis, procedure and demographic fields are cross-checked against clinical plausibility rules (sex-specific conditions, age-implausible diagnoses).',
    scope:(ds)=>['dx / procedure codes vs recorded sex and age'],
    cols:['Rule','Contradictions','Expected','Status'],
    items:(ds)=>[['sex-specific dx vs recorded sex','0','0','pass'],['age-implausible dx (<1y)','0','0','pass'],['sex-specific procedure vs recorded sex','0','0','pass']],
  },
  'Biomedical boundary checks':{
    method:'Numeric clinical values are tested against physiologic plausibility bounds per analyte; bounds derived from reference ranges widened to population extremes.',
    scope:(ds)=>['numeric lab / vitals columns'],
    cols:['Analyte','Observed range','Plausible bounds','Status'],
    items:(ds)=> ds==='EHR-207'
      ? [['serum creatinine','0.4–11.8 mg/dL','0.1–20','pass'],['eGFR','6–128','1–200','pass'],['HbA1c','4.1–14.2%','3–20%','pass']]
      : [['systolic BP','86–248 mmHg','40–300','pass'],['heart rate','31–204 bpm','15–250','pass']],
  },
};
function openCheckDetail(det, sid){
  const D=CHECK_DETAIL[det];
  const s=STAGE_BY_ID[sid];
  const run=stageRun(state.dataset,sid);
  const flagged=stageFindings(sid).filter(f=>detectorOf(f)===det);
  const cs=CLEAN_STATS[det]||{};
  let items=D&&D.items?D.items(state.dataset):[];
  /* Reconcile: item rows must agree with the breaches above them. */
  const RECON={
    'ANM-0142':(it)=>it.map(r=>({'2026-02':'−7.4%','2026-03':'−14.6%','2026-04':'−21.3%'})[r[0]]?[r[0],({'2026-02':'−7.4%','2026-03':'−14.6%','2026-04':'−21.3%'})[r[0]],'±6%','flag']:r),

/* Box-plot with the flagged value overlaid as a marker outside/inside the box. */
function boxplot(v, opts={}){
  const W=opts.w||420, H=opts.h||96, pl=10, pr=54, pt=26, pb=22;
  const flagged=v.flagged;
  const lo=Math.min(v.min, flagged), hi=Math.max(v.max, flagged);
  const pad=(hi-lo)*0.08||1; const dmin=lo-pad, dmax=hi+pad;
  const x=val=> pl + (val-dmin)/(dmax-dmin)*(W-pl-pr);
  const cy=pt+(H-pt-pb)/2, bh=22;
  const inRange = flagged>=v.q1 && flagged<=v.q3;
  const withinWhisk = flagged>=v.min && flagged<=v.max;

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Distribution box plot with flagged value">

    <line x1="${x(v.q3).toFixed(1)}" y1="${cy}" x2="${x(v.max).toFixed(1)}" y2="${cy}" stroke="var(--ink-3)" stroke-width="1.4"/>

    <line x1="${x(v.med).toFixed(1)}" y1="${(cy-bh/2).toFixed(1)}" x2="${x(v.med).toFixed(1)}" y2="${(cy+bh/2).toFixed(1)}" stroke="var(--teal)" stroke-width="2"/>
    <!-- labels: normal band -->

/* Compact norm strip for inline use: median band + flagged dot, one line. */
function normStrip(v, w=210){

/* ============================================================
   STAGE-LEVEL ANOMALY VISUALS — sense of what each step flagged
   ============================================================ */
/* how far past its threshold a check sits, 0..1 (for intensity) */
function severity01(f){
  const v=(CHECK_RESULTS[f.id]||{}).viz;
  if(v&&v.type==='gauge'){ const span=(v.max-v.min)||1; const over=Math.abs(v.value-v.threshold)/span; return Math.max(.12,Math.min(1,over)); }
  return f.priority?Math.max(.12,Math.min(1,f.priority/100)):.4;
}
function stageTone(dsId,sid){
  const fs=stageFindings(sid); if(!fs.length) return 'clean';
  if(fs.some(f=>/Confirmed/.test(f.dqrisk))) return 'fail';
  if(fs.some(f=>f.priority>=80)) return 'warn';
  return 'note';
}
const TONE_COL={clean:'var(--green)',note:'var(--teal)',warn:'var(--amber)',fail:'var(--red)',idle:'var(--line-strong)'};

/* (1) Lifecycle severity spine: 6 segments across the pipeline, height/heat = anomaly load */
function severitySpine(dsId, opts={}){
  const SS=opts.only?STAGES.filter(s=>opts.only.includes(s.id)):STAGES;
  const W=opts.w||680, H=opts.h||92, gap=8, n=SS.length;
  const cw=(W-gap*(n-1))/n, baseY=H-24, maxH=H-40;
  const counts=SS.map(s=>stageRun(dsId,s.id).ran?stageFindings(s.id).length:-1);
  const maxC=Math.max(1,...counts.filter(c=>c>0));
  let segs='';
  SS.forEach((s,i)=>{
    const x=i*(cw+gap), c=counts[i];
    const ran=c>=0;
    const tone= !ran?'idle': c===0?'clean':stageTone(dsId,s.id);
    const col=TONE_COL[tone];
    const h= !ran?10 : c===0?10 : 14+ (c/maxC)*(maxH-14);
    const y=baseY-h;
    segs+=`<g>
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${cw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${col}" opacity="${ran?(c===0?.35:.9):.25}"/>
      ${ran&&c>0?`<text x="${(x+cw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="11" font-weight="700" fill="${col}" text-anchor="middle" font-family="var(--mono)">${c}</text>`:''}
      <text x="${(x+cw/2).toFixed(1)}" y="${(baseY+13).toFixed(1)}" font-size="8.5" fill="var(--ink-3)" text-anchor="middle" font-family="var(--mono)">${i+1}·${s.short}</text>
      ${!ran?`<text x="${(x+cw/2).toFixed(1)}" y="${(baseY-3).toFixed(1)}" font-size="8" fill="var(--ink-3)" text-anchor="middle" font-family="var(--mono)">—</text>`:''}
    </g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Anomaly load by lifecycle stage">
    <line x1="0" y1="${baseY}" x2="${W}" y2="${baseY}" stroke="var(--line)" stroke-width="1"/>${segs}</svg>`;
}

/* (2) Per-stage detector strip: one cell per detector, filled by result vs threshold */
function detectorStrip(dsId, sid){
  const s=STAGE_BY_ID[sid];
  const dets=s.layers.flatMap(l=>LAYERS[l].detectors).filter((d,i,a)=>a.indexOf(d)===i);
  const fs=stageFindings(sid);
  return `<div style="display:flex;gap:8px;flex-wrap:wrap">`+dets.map(d=>{
    const hits=fs.filter(f=>detectorOf(f)===d);
    const cnt=hits.length;
    const sev=cnt?Math.max(...hits.map(severity01)):0;
    const tone=cnt? (hits.some(f=>/Confirmed/.test(f.dqrisk))?'fail':hits.some(f=>f.priority>=80)?'warn':'note') : 'clean';
    const col=TONE_COL[tone];
    return `<div title="${d}: ${cnt?cnt+' detected':'clean'}" style="flex:1 1 128px;min-width:118px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)">
      <div class="mono" style="font-size:10.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px">${d}</div>
      <div style="height:7px;background:#EEF1F3;border-radius:4px;overflow:hidden"><div style="height:100%;width:${cnt?Math.round(sev*100):3}%;background:${col};border-radius:4px"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:10px" class="mono">
        <span style="color:${col};font-weight:700">${cnt?(tone==='fail'?'confirmed':tone==='warn'?'high':'flagged'):'clean'}</span>
        <span class="muted">${cnt||0}</span></div>
    </div>`;
  }).join('')+`</div>`;
}

/* (3) Magnitude bars: each anomaly as a diverging bar from the expected baseline */
function magnitudeBars(fs){
  if(!fs.length) return '';
  const parsed=fs.map(f=>{ const m=(f.magnitude||'').match(/-?\d+(\.\d+)?/); return {f, val:m?parseFloat(m[0]):null, raw:f.magnitude||'—'}; });
  const maxA=Math.max(1,...parsed.map(p=>p.val!=null?Math.abs(p.val):0));
  return `<div style="display:flex;flex-direction:column;gap:7px">`+parsed.map(p=>{
    const sev=severity01(p.f), col=/Confirmed/.test(p.f.dqrisk)?'var(--red)':p.f.priority>=80?'var(--amber)':'var(--teal)';
    const pct=p.val!=null?Math.min(100,Math.abs(p.val)/maxA*100):Math.round(sev*100);
    return `<div style="display:grid;grid-template-columns:74px 1fr 92px;gap:10px;align-items:center;font-size:11.5px">
      <span class="mono muted">${p.f.id}</span>
      <span style="height:9px;background:#EEF1F3;border-radius:4px;overflow:hidden"><span style="display:block;height:100%;width:${pct.toFixed(0)}%;background:${col};border-radius:4px"></span></span>
      <span class="mono" style="text-align:right;color:var(--ink-2)">${p.raw}</span></div>`;
  }).join('')+`</div>`;
}

];
const STAGE_BY_ID = Object.fromEntries(STAGES.map(s=>[s.id,s]));

/* Default stage for a finding, by layer + timing (kept simple + explainable). */
function stageOf(f){
  if(f.stage) return f.stage;
  const L=layerOf(f);
  if(/Schema|Timestamp|Freshness/.test(f.family)) return 'onboarding';
  if(L==='pipeline') return /refresh/i.test(f.timing||'')?'staging':'production';
  if(L==='patient') return /sequenc|co-occur|boundary|plausib/i.test(f.family)?'ard':'production';
  return 'production';
}

/* ============================================================
   PER-STAGE ENGINE STATE
   Each dataset holds a pipeline of 6 stage-runs. Stages are
   sequential-but-overrideable: a stage is 'locked' until the
   previous stage's gate passes, or a reviewer force-unlocks it.
   ============================================================ */
const STAGE_RUNS = {};   // { datasetId: { stageId: {status, verdict, ran, runId, at, overridden, waived} } }
let RUN_SEQ = 1041;
function nextRunId(){ return 'RUN-'+(++RUN_SEQ); }
function stamp(){ const d=new Date(); return d.toISOString().slice(0,10)+' '+d.toTimeString().slice(0,5); }
function initRuns(dsId, preScanned){
  if(STAGE_RUNS[dsId]) return STAGE_RUNS[dsId];
  const r={};
  STAGES.forEach((s)=>{ r[s.id]={ status:'idle', verdict:null, ran:false, overridden:false }; });
  // Evaluation is a density assessment, not a detector run — it clears by default so Onboarding is reachable.
  r['evaluation']={ status:'complete', verdict:'pass', ran:true, overridden:false, assessment:true };
  if(preScanned){
    ['onboarding','staging','production'].forEach(sid=>{
      let v=computeVerdict(dsId,sid), waived=false;
      if(v==='fail'){ v='restricted'; waived=true; }   // historical gates cleared under waiver, never silent
      r[sid]={ status:'complete', verdict:v, ran:true, overridden:false, waived, runId:nextRunId(), at:stamp() };
    });
  }
  STAGE_RUNS[dsId]=r; return r;
}
function runsFor(dsId){
  return STAGE_RUNS[dsId] || initRuns(dsId, !!(typeof DATASETS!=='undefined' && DATASETS[dsId] && DATASETS[dsId].scanned));
}
function stageRun(dsId,stageId){ return runsFor(dsId)[stageId] || {status:'idle',verdict:null,ran:false}; }

/* Verdict a stage lands on, given its confirmed findings (pre-authored demo logic). */
function computeVerdict(dsId, stageId){
  const finds=(DATASETS[dsId]?DATASETS[dsId].findings:[]).filter(f=>stageOf(f)===stageId);
  const confirmed=finds.filter(f=>/Confirmed/.test(f.dqrisk)).length;
  const high=finds.filter(f=>f.priority>=80).length;
  if(confirmed) return 'fail';                 // -> reject/quarantine/fail build per stage
  if(high) return 'restricted';                // pass with restrictions
  return 'pass';
}
function defaultVerdict(dsId,stageId){ return computeVerdict(dsId,stageId); }

/* Is a stage unlocked to run? Stage 1 always is; others need prior gate passed or an override. */
function stageUnlocked(dsId, stageId){
  const idx=STAGES.findIndex(s=>s.id===stageId);
  if(idx<=0) return true;
  const prev=STAGES[idx-1], prevRun=stageRun(dsId,prev.id);
  if(stageRun(dsId,stageId).overridden) return true;
  return prevRun.ran && (prevRun.verdict==='pass' || prevRun.verdict==='restricted');
}
function stageBlockedReason(dsId, stageId){
  const idx=STAGES.findIndex(s=>s.id===stageId);
  if(idx<=0 || stageUnlocked(dsId,stageId)) return null;
  const prev=STAGES[idx-1], pr=stageRun(dsId,prev.id);
  if(!pr.ran) return `${prev.n} has not been run yet`;
  if(pr.verdict==='fail') return `${prev.n} gate failed (${prev.gate})`;
  return `${prev.n} not cleared`;
}

/* derived: has ANY stage run for this dataset (keeps legacy DSB.scanned gates working) */
function anyStageRun(dsId){ const r=runsFor(dsId); return STAGES.some(s=>s.id!=='evaluation' && r[s.id] && r[s.id].ran); }

/* Where a dataset stands: first not-yet-run stage, or complete. */
function frontier(dsId){
  for(const s of STAGES){
    const r=stageRun(dsId,s.id);
    if(!r.ran) return { stage:s, state: stageUnlocked(dsId,s.id)?'ready':'locked' };
  }
  return { stage:null, state:'complete' };
}
function worstVerdict(dsId){
  const order={fail:3,restricted:2,pass:1};
  let w=null; STAGES.forEach(s=>{ const r=stageRun(dsId,s.id); if(r.ran && r.verdict && (!w||order[r.verdict]>order[w])) w=r.verdict; });
  return w;
}
function findingsForDs(dsId){ return (DATASETS[dsId]&&DATASETS[dsId].findings)||[]; }
function surfacedCountDs(dsId){ return findingsForDs(dsId).filter(f=>stageRun(dsId,stageOf(f)).ran).length; }

/* ============================================================
   CHART HELPERS (hand-rolled SVG — signature expected-band motif)
   ============================================================ */
function expectedBandChart(s, opts={}){
  const W=opts.w||680, H=opts.h||230, pl=42, pr=14, pt=14, pb=26;
  const n=s.obs.length;
  const all=[...s.hi,...s.obs,...s.lo];
  const min=Math.min(...all)*0.96, max=Math.max(...all)*1.02;
  const x=i=> pl + i*(W-pl-pr)/(n-1);
  const y=v=> pt + (max-v)/(max-min)*(H-pt-pb);
  const line=(arr)=>arr.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  // band area
  const band=[...s.hi.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)),
              ...s.lo.map((v,i)=>'L'+x(n-1-i).toFixed(1)+','+y(s.lo[n-1-i]).toFixed(1))].join(' ')+' Z';
  let dots='';
  s.obs.forEach((v,i)=>{ if(v<s.lo[i]||v>s.hi[i]) dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.4" fill="var(--red)"/>`; });
  // incomplete hatch
  let hatch='';
  if(s.incompleteFrom!=null){
    const x0=x(s.incompleteFrom-0.5), x1=x(n-1)+6;
    hatch=`<rect x="${x0.toFixed(1)}" y="${pt}" width="${(x1-x0).toFixed(1)}" height="${H-pt-pb}" fill="url(#hatch)" opacity=".55"/>`;
  }
  let onset='';
  if(s.onset!=null){
    const ox=x(s.onset);
    onset=`<line x1="${ox.toFixed(1)}" y1="${pt}" x2="${ox.toFixed(1)}" y2="${H-pb}" stroke="var(--red)" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="${(ox+4).toFixed(1)}" y="${pt+11}" font-size="9.5" fill="var(--red)" font-family="var(--mono)">${s.onsetLabel||'refresh boundary'}</text>`;
  }
  // y ticks
  let yt='';
  for(let k=0;k<=3;k++){ const v=min+(max-min)*k/3; const yy=y(v); yt+=`<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${(yy+3).toFixed(1)}" font-size="9" fill="var(--ink-3)" text-anchor="end" font-family="var(--mono)">${Math.round(v)}</text>`; }
  let xt='';
  s.labels.forEach((l,i)=>{ if(i%3===0||i===n-1) xt+=`<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="8.5" fill="var(--ink-3)" text-anchor="middle" font-family="var(--mono)">${l}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Observed vs expected range">
    <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--ink-3)" stroke-width="1"/></pattern></defs>
    ${yt}${hatch}
    <path d="${band}" fill="var(--band)" opacity=".75"/>
    <path d="${line(s.exp)}" fill="none" stroke="var(--band-line)" stroke-width="1.2" stroke-dasharray="3 3"/>
    ${onset}
    <path d="${line(s.obs)}" fill="none" stroke="var(--teal)" stroke-width="2"/>
    ${dots}${xt}
  </svg>`;
}
function hbars(rows, opts={}){ // rows: [label, value, max, colorClass]
  const max=opts.max||Math.max(...rows.map(r=>Math.abs(r[1])));
  return `<div style="display:flex;flex-direction:column;gap:8px">`+rows.map(r=>{
    const pct=Math.min(100,Math.abs(r[1])/max*100);
    const col=r[3]||'var(--teal)';
    return `<div style="display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:12px">
      <div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r[0]}</div>
      <div style="height:9px;background:#EEF1F3;border-radius:4px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${col};border-radius:4px"></div></div>
      <div class="num" style="text-align:right;color:var(--ink-2)">${r[4]||r[1]}</div></div>`;
  }).join('')+`</div>`;
}
function spark(arr,opts={}){
  const W=opts.w||90,H=opts.h||24; const min=Math.min(...arr),max=Math.max(...arr);
  const x=i=>i*W/(arr.length-1), y=v=>H-2-((v-min)/((max-min)||1))*(H-4);
  const d=arr.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><path d="${d}" fill="none" stroke="${opts.color||'var(--teal)'}" stroke-width="1.5"/></svg>`;
}
function scoreBars(score){
  const abbr={Magnitude:'Mag',Confidence:'Conf',Reach:'Reach',Persistence:'Persist',Recency:'Recency','Data-quality risk':'DQ risk'};
  return `<div class="scorewrap">`+Object.entries(score).map(([k,v])=>{
    const cls=v>=80?'hi':v>=60?'md':'';
    return `<div class="sc"><div class="n">${abbr[k]||k}</div><div class="track"><div class="fill ${cls}" style="width:${v}%"></div></div><div class="val">${v}</div></div>`;
  }).join('')+`</div>`;
}
function pips(n){ return `<span class="pips">`+[1,2,3,4,5].map(i=>`<span class="pip ${i<=n?'on':''}"></span>`).join('')+`</span>`; }

const OBS_STAGES=['evaluation','onboarding','staging'];

function obsComplete(ds){ return OBS_STAGES.every(sid=>stageRun(ds,sid).ran); }
function isPromoted(ds){ const m=DATASETS[ds]&&DATASETS[ds].meta; return !!(m&&m.promotion&&m.promotion.promoted); }
function inObservability(ds){ return true; }                            // every registered dataset lives in step 1
function inInvestigation(ds){ return isPromoted(ds); }                  // explicit promote action
function inDecide(ds){ return isPromoted(ds) && stageRun(ds,'production').ran; } // production checks have run
function promoteDataset(ds){
  if(!can('edit')){ toast('This role is view-only','gov'); return; }
  if(!obsComplete(ds)){ toast('Observability checks (evaluation · onboarding · staging) must run first','gov'); return; }
  DATASETS[ds].meta.promotion={promoted:true, by:ROLES[state.role], at:stamp()};
  logAudit(`Dataset ${ds} promoted from Observability to Investigation by ${ROLES[state.role]}. Observability gates: ${OBS_STAGES.map(sid=>stageRun(ds,sid).verdict||'pass').join(' / ')}.`,'gov');
  toast('Promoted to Investigation — production · ARD · use-case checks now run there');
  render();
}
function memberDatasets(ws){
  const ids=Object.keys(DATASETS);
  if(ws==='investigate') return ids.filter(inInvestigation);
  if(ws==='decide') return ids.filter(inDecide);

}

function authHeroSVG(){
  // decorative expected-band motif — the product's signature chart, as brand art
  const W=470,H=150,pl=8,pr=8,pt=12,pb=16,n=12;
  const lo=v=>H-pb-(v-70)/40*(H-pt-pb), x=i=>pl+i*(W-pl-pr)/(n-1);
  const exp=Array(n).fill(100), hiB=exp.map(v=>v+5), loB=exp.map(v=>v-5);
  const obs=[100,101,99,100,101,100,99,100,93,88,90,95];
  const line=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+lo(v).toFixed(1)).join(' ');
  const band=[...hiB.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+lo(v).toFixed(1)),
              ...loB.map((v,i)=>'L'+x(n-1-i).toFixed(1)+','+lo(loB[n-1-i]).toFixed(1))].join(' ')+' Z';
  let dots=''; obs.forEach((v,i)=>{ if(v<95) dots+=`<circle cx="${x(i).toFixed(1)}" cy="${lo(v).toFixed(1)}" r="3.4" fill="#FFB3A9"/>`; });
  const ox=x(8);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Observed values leaving and returning to the expected range">
    <path d="${band}" fill="rgba(255,255,255,.13)"/>
    <path d="${line(exp)}" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="${ox.toFixed(1)}" y1="${pt}" x2="${ox.toFixed(1)}" y2="${H-pb}" stroke="#FFB3A9" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="${(ox+5).toFixed(1)}" y="${pt+10}" font-size="9.5" fill="#FFB3A9" font-family="var(--mono)">refresh boundary</text>
    <path d="${line(obs)}" fill="none" stroke="#8FDDE4" stroke-width="2"/>${dots}
  </svg>`;
}

function loadDataset(id){

  if(typeof DSB!=='undefined') DSB.scanned = anyStageRun(id);
  logAudit(`Dataset ${id} (${DATA.dataset.name}) loaded to workspace — checksum verified, profile generated. Read-only.`,'teal');

  go('intake','inspect');
}

function toggleCol(key){ const off=state.scanScope.off; off[key]?delete off[key]:off[key]=true; render(); }
function runScanScoped(){
  const n=scopeCounts();
  const scopeTxt = state.scanScope.mode==='all' ? 'all '+n.total+' columns' : n.on+' of '+n.total+' columns ('+Object.keys(state.scanScope.off).join(', ')+' excluded)';
  if(anyStageRun(state.dataset)){
    logAudit(`Scan scope reviewed for ${DATA.dataset.id}: ${scopeTxt}. Lifecycle pipeline already initialized.`,'teal');
    toast('Opening lifecycle pipeline'); go('lifecycle'); return;
  }
  logAudit(`Scan scope configured for ${DATA.dataset.id}: ${scopeTxt}. Checks run per lifecycle stage.`,'teal');
  toast('Scope set — start the first checks below');
  go('lifecycle');
}

/* ============================================================
   FIT-FOR-PURPOSE MODEL
   Translates DQ findings + fitness verdict into a usability
   assessment an analyst can act on: which measures / periods /
   segments are usable, caveated, or unusable — and why.
   ============================================================ */
const FITNESS_RANK={ 'Accept':3, 'Accept with restrictions':2, 'Pause':1, 'Reject':0, 'Decision pending':2, 'Pending':2 };
function datasetFitness(id){
  const b=DATASETS[id]; const f=(b.meta.fitness)||{};
  const verdict=f.working||'Decision pending';
  const fs=findingsForDs(id).filter(x=>stageRun(id,stageOf(x)).ran);
  const conf=fs.filter(x=>/Confirmed/.test(x.dqrisk));
  const likely=fs.filter(x=>/Likely/.test(x.dqrisk));
  // usability of measures — from findings that name a measure
  const measures={};
  fs.forEach(x=>{ const m=x.measure||'—'; const sev = /Confirmed/.test(x.dqrisk)?'unusable': /Likely/.test(x.dqrisk)?'caveated':'caveated';
    if(!measures[m]||sev==='unusable') measures[m]={state:sev, driver:x.id, magnitude:x.magnitude, period:x.period, note:x.title};
  });
  const studies=(b.studies||[]).map(s=>({...s}));
  return { verdict, note:f.workingNote||'', findings:fs, confirmed:conf, likely, measures, studies,
    band: FITNESS_RANK[verdict]>=3?'green':FITNESS_RANK[verdict]===2?'amber':'red' };
}
const FIT_UI={ green:['Fit for use','var(--green)','✓'], amber:['Fit with restrictions','var(--amber)','!'], red:['Not fit for use','var(--red)','✕'] };

function wsStageScope(){ const ws=state.workspace||'observe'; return ws==='observe'?OBS_STAGES:STAGES.map(s=>s.id); }
function dsDQ(id){
  const scope=wsStageScope();
  const fs=findingsForDs(id).filter(x=>scope.includes(stageOf(x)) && stageRun(id,stageOf(x)).ran);
  return {
    total: fs.length,
    hi: fs.filter(f=>f.priority>=80).length,
    conf: fs.filter(f=>/Confirmed/.test(f.dqrisk)).length,
    open: fs.filter(f=>['Under investigation','Submitted for review'].includes(f.status)).length,
    fitness: (DATASETS[id].meta.fitness && DATASETS[id].meta.fitness.working) || null,
  };
}
function dqChips(id, compact){
  const q=dsDQ(id);
  if(!q.total) return compact
    ? `<span class="small muted">No findings surfaced yet</span>`
    : `<span class="chip grey"><span class="cd"></span>No findings surfaced yet</span>`;
  if(compact){
    // chip diet: numbers carry the emphasis, one quiet line
    return `<span class="small" style="white-space:nowrap"><b>${q.total}</b> findings`
      +(q.hi?` · <b style="color:var(--red)">${q.hi}</b> high`:'')
      +(q.conf?` · <b style="color:var(--amber)">${q.conf}</b> confirmed`:'')+`</span>`;
  }
  return [
    `<span class="chip grey"><span class="cd"></span>${q.total} finding${q.total===1?'':'s'}</span>`,
    q.hi?`<span class="chip red"><span class="cd"></span>${q.hi} high-priority</span>`:'',
    q.conf?`<span class="chip amber"><span class="cd"></span>${q.conf} confirmed DQ</span>`:'',
    q.open?`<span class="chip teal"><span class="cd"></span>${q.open} in investigation</span>`:'',
  ].filter(Boolean).join('');
}

const CELL_UI={
  pass:      ['✓','var(--green)','#E7F6EC','Gate passed'],

function scopedFrontier(dsId){
  const scope=wsStageScope();

  return {stage:null};
}
function boardRunNext(dsId){

}

function myWork(){
  if(state.role==='executive') return [];
  const items=[];
  const scope=wsStageScope();
  (state.loaded?[state.dataset]:Object.keys(DATASETS)).forEach(id=>{
    const fr=scopedFrontier(id);
    if(state.role==='analyst' && fr.stage && fr.state==='ready' && scope.includes(fr.stage.id))
      items.push({t:`Run <b>${fr.stage.short}</b> detectors for ${DATASETS[id].meta.dataset.name}`, age:'due today', tone:'teal', act:`boardRunNext('${id}')`, lbl:'Run'});
    const fs=findingsForDs(id).filter(f=>scope.includes(stageOf(f)) && stageRun(id,stageOf(f)).ran);
    if(state.role==='analyst'){

        items.push({t:`Triage <b>${f.id}</b> — ${f.title}`, age:'aging 1d', tone:'red', act:`openDsStage('${id}','${stageOf(f)}')`, lbl:'Open'}));

}

function stageChip(id){
  const fr=frontier(id);
  if(!fr.stage){ const wv=worstVerdict(id);
    const t=wv==='fail'?'red':wv==='restricted'?'amber':'green';
    return `<span class="chip ${t}"><span class="cd"></span>${wv==='fail'?'Gates failed':wv==='restricted'?'Cleared w/ restrictions':'All gates cleared'}</span>`; }
  const i=STAGES.findIndex(s=>s.id===fr.stage.id);
  // upstream failure that halted the pipeline before this frontier?
  const failed=STAGES.slice(0,i).find(s=>stageRun(id,s.id).verdict==='fail');
  if(failed) return `<span class="chip red"><span class="cd"></span>Halted at ${failed.short} — gate failed</span>`;
  if(fr.state==='locked') return `<span class="chip grey"><span class="cd"></span>${LOCK_SVG(10)} Blocked at ${fr.stage.short}</span>`;
  const restricted=STAGES.slice(0,i).some(s=>stageRun(id,s.id).verdict==='restricted');
  const tone=restricted?'amber':'teal';
  return `<span class="chip ${tone}"><span class="cd"></span>Stage ${i+1}/6 · ${fr.stage.short} ready${restricted?' · restrictions upstream':''}</span>`;
}

    {key:'all',    name:'All enrolled members',                      n:'48,213 patients', pct:'100%', criteria:['Any enrollment in the delivery window']},
    {key:'cardio', name:'Cardiometabolic Longitudinal Cohort v7',    n:'18,402 patients', pct:'38%',  criteria:['T2DM or heart-failure dx (≥1 inpatient or ≥2 outpatient)','Continuous enrollment ≥ 12 months','Age ≥ 18 at index']},
    {key:'hf',     name:'Incident heart-failure cohort',             n:'6,911 patients',  pct:'14%',  criteria:['First HF dx in window (12-month clean period)','Continuous enrollment ≥ 12 months']},
  ],
  'EHR-207':[
    {key:'all', name:'All active patients',        n:'62,400 patients', pct:'100%', criteria:['≥1 encounter in the delivery window']},
    {key:'ckd', name:'CKD Progression Cohort v3',  n:'9,317 patients',  pct:'15%',  criteria:['eGFR < 60 on ≥2 tests ≥ 90 days apart','≥ 12 months of lab history']},
    {key:'dm',  name:'Diabetes registry',          n:'14,220 patients', pct:'23%',  criteria:['HbA1c ≥ 6.5% or diabetes dx on problem list']},

  ],
};
const DEFAULT_COHORT = { 'DSN-114':'cardio', 'EHR-207':null, 'SYN-001':'all' }; // pre-scanned datasets ran under these
function activeCohort(ds){
  const meta=DATASETS[ds]&&DATASETS[ds].meta;
  const presets=COHORT_PRESETS[ds]||[{key:'all',name:'All records',n:'—',pct:'100%',criteria:[]}];
  if(meta&&meta.cohortSel) return {...presets.find(p=>p.key===meta.cohortSel.key)||presets[0], confirmed:!!meta.cohortSel.confirmed};
  const dk=DEFAULT_COHORT[ds];
  if(dk && anyStageRun(ds)) return {...presets.find(p=>p.key===dk)||presets[0], confirmed:true};
  return {...presets[0], confirmed:false};
}
function cohortLocked(ds){ return anyStageRun(ds); }
function cohortChip(ds, small){
  const c=activeCohort(ds);
  return `<span class="chip ${c.confirmed?'teal':'grey'}" role="button" tabindex="0" style="cursor:pointer" title="${cohortLocked(ds)?'Cohort travels with the pipeline (locked after first run)':'Click to define the cohort'}"
    onclick="openCohortModal('${ds}')" onkeydown="if(event.key==='Enter'){openCohortModal('${ds}')}">
    <span class="cd"></span>Cohort: ${c.name}${small?'':' · '+c.n}${cohortLocked(ds)?' 🔒'.replace('🔒',LOCK_SVG(9)):''}</span>`;

function openCohortModal(ds){
  const locked=cohortLocked(ds), cur=activeCohort(ds);
  const presets=COHORT_PRESETS[ds]||[];
  openModal(`<div class="modal" style="max-width:560px"><div class="modal-h"><h3>${locked?'Cohort — locked to pipeline':'Define cohort'}</h3><button class="x" onclick="closeModal()">×</button></div>

function confirmCohort(ds){
  const meta=DATASETS[ds].meta;
  meta.cohortSel={key:(meta.cohortSel&&meta.cohortSel.key)||(COHORT_PRESETS[ds]||[{key:'all'}])[0].key, confirmed:true};

/* Handoff strip: Signals -> Findings -> Decisions across the three workspaces */
function handoffStrip(){
  if(!state.loaded) return '';
  const ds=state.dataset, ws=state.workspace||'observe';
  const cur=['observe','investigate','decide'].indexOf(ws);
  // step 1 — intake (always visible): checks + signals from the intake stages only
  const obsRan=OBS_STAGES.filter(sid=>sid!=='evaluation'&&stageRun(ds,sid).ran).map(sid=>STAGE_BY_ID[sid]);
  const obsChecks=obsRan.reduce((a,st)=>a+st.layers.flatMap(l=>LAYERS[l].detectors).filter((d,i2,x)=>x.indexOf(d)===i2).length,0);
  const obsSig=surfacedFindings().filter(f=>OBS_STAGES.includes(stageOf(f))).length;
  // step 2 — investigation (visible from investigate onward)
  const all=surfacedFindings();
  const open=all.filter(f=>['New','Reviewed','Under investigation'].includes(f.status)).length;
  const conf=all.filter(f=>/Confirmed/.test(f.dqrisk)).length;
  // step 3 — decide
  const F=datasetFitness(ds);
  const fitRec=F.verdict&&F.verdict!=='Decision pending';
  const pendSt=STUDIES.filter(x=>x.decision==='Pending').length;
  const promoted=isPromoted(ds);
  const step=(idx,cls,onclick,inner)=>`<span class="h-step ${cls}" ${onclick?`onclick="${onclick}"`:''}>${inner}</span>`;
  return `<div class="handoff" role="navigation" aria-label="Observe to Decide pipeline">
    ${step(0, ws==='observe'?'cur':'', "state.workspace='observe';go('detections')",
      `<span>◉</span><b>${obsChecks}</b> intake checks · <b>${obsSig}</b> signals`)}
    <span class="h-arrow">→</span>
    ${cur>=1
      ? step(1, ws==='investigate'?'cur':'', "state.workspace='investigate';go('anomalies')",
          `<span>▲</span><b>${all.length}</b> findings · <b>${open}</b> open · <b>${conf}</b> confirmed`)
      : step(1,'future',null,`<span>▲</span>Investigation — ${promoted?'promoted':'after promote'}`)}
    <span class="h-arrow">→</span>
    ${cur>=2
      ? step(2, ws==='decide'?'cur':'', "state.workspace='decide';go('fitness')",
          `<span>◆</span>${fitRec?`decision: <b>${F.verdict}</b>`:'fitness <b>pending</b>'} · <b>${pendSt}</b> study decision${pendSt===1?'':'s'} pending`)
      : step(2,'future',null,`<span>◆</span>Governance — after production checks`)}
  </div>`;
}

      return `<div class="card"><div class="card-b between" style="align-items:center;gap:14px;flex-wrap:wrap">

          <button class="btn sm" onclick="enterDataset('${id}')">Enter →</button></div>

function runStage(id, rerun){
  const s=STAGE_BY_ID[id];
  if(!can('edit')){ toast('This role is read-only','gov'); return; }
  if(!stageUnlocked(state.dataset,id)){ toast('Stage is locked — prior gate not passed','gov'); return; }
  if((state.workspace||'observe')==='observe' && INV_STAGES.includes(id)){ toast('Production · ARD · use-case checks run in Investigation','gov'); return; }
  if(state.workspace==='investigate' && OBS_STAGES.includes(id)){ toast('Intake checks (evaluation · onboarding · staging) run in Observability','gov'); return; }
  if(state.workspace==='investigate' && !isPromoted(state.dataset)){ toast('Dataset not yet promoted from Observability','gov'); return; }
  // cohort travels with the pipeline: confirm (default if unset) before the first run
  if(!activeCohort(state.dataset).confirmed){
    const meta=DATASETS[state.dataset].meta;
    meta.cohortSel={key:(meta.cohortSel&&meta.cohortSel.key)||(COHORT_PRESETS[state.dataset]||[{key:'all'}])[0].key, confirmed:true};
    logAudit(`Cohort defaulted for ${state.dataset}: "${activeCohort(state.dataset).name}" — no explicit selection before first run.`,'teal');
  }
  state.running=id; state.runningDs=state.dataset; render();
  const detectors=s.layers.flatMap(l=>LAYERS[l].detectors);
  setTimeout(()=>{
    const run=stageRun(state.dataset,id);
    const wasRun=run.ran;
    run.status='complete'; run.ran=true; run.verdict=computeVerdict(state.runningDs||state.dataset,id);
    run.runId=nextRunId(); run.at=stamp();
    state.running=null; state.runningDs=null;
    if(typeof DSB!=='undefined') DSB.scanned = anyStageRun(state.dataset); // keep legacy gates satisfied
    const fs=stageFindings(id);
    logAudit(`Engine run ${run.runId} — ${s.n}: ${detectors.length} detectors executed (${s.layers.map(l=>LAYERS[l].n).join('+')}) within cohort "${activeCohort(state.dataset).name}". ${fs.length} findings; gate verdict: ${run.verdict.toUpperCase()}${wasRun?'. Re-execution under identical configuration; results reproduced':''}.`,'teal','System · anomaly engine');
    toast(`${s.n} run complete — ${fs.length} findings, gate ${run.verdict.toUpperCase()}`);
    render();
  }, 1900);
}
const OVERRIDE_CODES=['Approved waiver on record','Urgent business need — risk accepted','Vendor re-supply expected; parallel processing approved','Investigation running in parallel per SOP','Other (specify)'];

function confirmOverride(id){
  const s=STAGE_BY_ID[id];

function miniEvidenceChart(f){

  const base=100, s={labels:['','','','','','','','','','','',''],exp:Array(12).fill(base),lo:Array(12).fill(base*0.94),hi:Array(12).fill(base*1.06),

  return expectedBandChart(s,{h:150});
}

};
function submitBlock(f){
  if(INV.approved) return `<div class="callout green"><span class="ci">✓</span><div>Approved by Reviewer. Live report <b class="mono">${INV.reportVersion}</b> created (immutable). <a onclick="go('reports')">Open report →</a></div></div>`;
  if(INV.submitted) return `<div class="callout purple"><span class="ci">${LOCK_SVG(12)}</span><div>Submitted for independent review — editing is locked. Only the Reviewer can act. <a onclick="go('investigation','review')">Go to Review tab →</a></div></div>`;
  const ready = INV.disposition && INV.causes.length>0;
  const reasons=[]; if(!INV.disposition)reasons.push('set a disposition'); if(INV.causes.length===0)reasons.push('add ≥1 cause'); if(state.role!=='analyst')reasons.push('Analyst role required');
  const ok = ready && state.role==='analyst';
  return `<div class="between">
    <div class="small muted">Submission requires: disposition set · impact complete · Analyst role. Submission locks editing.</div>
    <button class="btn pri" ${ok?'':'disabled'} onclick="submitForReview()">Submit for independent review</button>
  </div>${ok?'':`<div class="locknote">⚠ To submit: ${reasons.join(' · ')}.</div>`}`;
}
function setHyp(id,action){ const h=INV.hypotheses.find(x=>x.id===id); h.action=action; logAudit(`Hypothesis ${id} (${h.cls}) marked ${action}.`); toast(`${id} ${action}`); render(); }
function runCheck(i){ const c=INV.checks[i]; c.run=true; logAudit(`Ran check: ${c.name} — ${c.result}. Effect: ${c.effect}.`); toast('Check run: '+c.name); render(); }
function setDisp(d){ INV.disposition=d; logAudit(`Disposition set: ${d}.`); toast('Disposition: '+d); render(); }
function toggleCause(c){ const i=INV.causes.indexOf(c); if(i<0)INV.causes.push(c); else INV.causes.splice(i,1); logAudit(`Cause classification updated: ${INV.causes.join(', ')||'(none)'}.`); render(); }
function submitForReview(){
  INV.submitted=true; FINDINGS.find(f=>f.id==='ANM-0142').status='Submitted for review';
  logAudit('Submitted INV-2026-041 for independent review (GOV-R2 trigger). Editing locked.','purple');
  toast('Submitted for review — switch to Reviewer role to act','gov'); go('investigation','review');
}

function recordVerdict(v){

}
function holdModal(){
  openModal(`<div class="modal"><div class="modal-h"><h3 style="color:var(--red)">Hold release v2026.07</h3><button class="x" onclick="closeModal()">×</button></div>

  <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="doHold()">Confirm hold & notify</button></div></div>`);

function doHold(){
  const r=document.getElementById('holdReason').value.trim();
  if(!r){ toast('Rationale required to hold'); return; }
  DATA._v07decision={verdict:'Held', by:(state.role==='reviewer'?'Dr. L. Ferreira':'M. Okafor'), ts:'2026-07-29'};
  RELEASES.find(x=>x.v==='v2026.07').verdict='Held';
  logAudit('Release v2026.07 HELD. Rationale: '+r+'. Vendor + study teams notified.','red');
  closeModal(); toast('Release held — vendor & study teams notified','gov'); render();
}

/* merge the new detector findings into the claims dataset + re-activate current */
(function(){
  if(typeof CLAIMS_FINDINGS!=='undefined' && typeof NEW_CLAIMS_FINDINGS!=='undefined'){
    NEW_CLAIMS_FINDINGS.forEach(f=>{ if(!CLAIMS_FINDINGS.some(x=>x.id===f.id)) CLAIMS_FINDINGS.push(f); });
    if(typeof DATASETS!=='undefined' && DATASETS['DSN-114']) DATASETS['DSN-114'].findings = CLAIMS_FINDINGS;
    if(typeof state!=='undefined' && state.dataset) activateDataset(state.dataset);
  }
})();

<script>
(function(){
  if(!window.SYN_FINDINGS){ console.warn('pipeline_findings.js not loaded'); return; }

  // 1) Build meta by cloning the claims meta so every meta-dependent screen has a
  //    complete shape, then deep-merge the pipeline's Synthea-accurate metadata over
  //    it (identity, readiness, profile, cohort definition) so nothing is placeholder.
  var meta = JSON.parse(JSON.stringify(CLAIMS_DATA));
  var SM = window.SYN_META || {};
  Object.keys(SM).forEach(function(k){
    meta[k] = (SM[k] && typeof SM[k]==='object' && !Array.isArray(SM[k]))
      ? Object.assign({}, meta[k], SM[k])   // merge sub-object (keep any field we didn't override)
      : SM[k];                              // replace arrays / scalars outright
  });
  meta.families = window.SYN_FAMILIES;

  // 2) Register the dataset — the switcher lists Object.keys(DATASETS) automatically.
  DATASETS['SYN-001'] = {
    scanned:true, meta:meta, findings:window.SYN_FINDINGS,
    releases:[], studies:[], tickets:[], bias:[], inv:null,
    audit:(window.SYN_AUDIT||[])
  };

  // strip SNOMED-style category tags so notes read like plain English
  function cleanNote(s){
    return String(s||'').replace(/\s*\((disorder|procedure|situation|finding|regime\/therapy|environment|morphologic abnormality|substance|qualifier value)\)/gi,'');
  }
  var sevOf = function(f){ return /Confirmed/.test(f.dqrisk)?'red':/Likely/.test(f.dqrisk)?'amber':'teal'; };

  // 3b) Plain-language drill-down: what it is, why it's flagged, what to check,
  //     then the individual claims (no jargon, no algorithm names).
  var _origOpenFinding = window.openFinding;
  window.openFinding = function(id){
    var f = FINDINGS.find(function(x){ return x.id===id; });
    if(!f || !f.evidence){ return _origOpenFinding(id); }  // narrative datasets unchanged
    var rows = f.evidence.map(function(e){
      return '<tr>'
        + '<td class="mono" style="font-weight:600">'+e.claim_id+'</td>'
        + '<td>'+e.cls+'</td>'
        + '<td style="text-align:right">'+e.age+'</td>'
        + '<td style="text-align:right">$'+e.billed.toLocaleString()+'</td>'
        + '<td style="text-align:right">'+e.nproc+'</td>'
        + '<td style="text-align:right"><b>'+e.score.toFixed(2)+'</b></td>'
        + '<td style="max-width:56ch;font-size:12px;color:var(--ink-2);line-height:1.5">'+(e.reason||cleanNote(e.note))+'</td>'
        + '</tr>';
    }).join('');
    var sev = sevOf(f);
    openModal('<div class="modal wide"><div class="modal-h">'
      + '<span class="mono" style="font-weight:600">'+f.id+'</span>'
      + '<h3 style="margin-left:6px">'+f.kind+'</h3>'
      + '<button class="x" onclick="closeModal()">×</button></div>'
      + '<div class="modal-b">'
      + '<div class="row" style="gap:6px;margin-bottom:14px">'
      +   '<span class="chip '+sev+'"><span class="cd"></span>'+f.dqrisk+'</span>'
      +   '<span class="chip grey"><span class="cd"></span>'+f.signals+' claims flagged</span></div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">'
      +   '<div class="callout teal"><span class="ci">What this is</span><div>'+f.what+'</div></div>'
      +   '<div class="callout amber"><span class="ci">Why it’s flagged</span><div>'+f.whyFlag+'</div></div>'
      + '</div>'
      + '<div class="callout teal" style="margin-bottom:16px"><span class="ci">What to check</span><div>'+f.check+'</div></div>'
      + '<h4 style="margin:4px 0 8px;font-size:13px">The '+f.signals+' claims — each with why it was flagged '
      +   '<span class="muted xsmall">(most unusual first · showing '+f.evidence.length+')</span></h4>'
      + '<div style="overflow-x:auto"><table class="ev-tbl" style="width:100%;border-collapse:collapse;font-size:12px">'
      +   '<thead><tr style="text-align:left;border-bottom:1px solid var(--line);color:var(--ink-3)">'
      +     '<th style="padding:6px 8px">Claim</th><th style="padding:6px 8px">Visit type</th>'
      +     '<th style="padding:6px 8px;text-align:right">Age</th><th style="padding:6px 8px;text-align:right">Billed</th>'
      +     '<th style="padding:6px 8px;text-align:right">Lines</th><th style="padding:6px 8px;text-align:right">Unusualness</th>'
      +     '<th style="padding:6px 8px">Why this record was flagged</th></tr></thead>'
      +   '<tbody>'+rows+'</tbody></table></div>'
      + '<p class="small muted" style="margin-top:10px;font-style:italic">These are the individual claims that triggered this kind, most unusual first (0–1 scale). '
      +   'A flag is a suspected data issue to confirm — not a confirmed error.</p>'
      + '</div><div class="modal-f"><button class="btn" onclick="closeModal()">Close</button></div></div>');
  };

  // style hook: zebra rows for the evidence table
  var st=document.createElement('style');
  st.textContent='.ev-tbl tbody tr{border-bottom:1px solid var(--line)}'
    +'.ev-tbl tbody tr:hover{background:var(--surface-2)}'
    +'.ev-tbl td{padding:6px 8px;vertical-align:top}';
  document.head.appendChild(st);

  render(); // refresh so the dataset dropdown shows SYN-001
  console.log('[pipeline] registered SYN-001 with', window.SYN_FINDINGS.length,
              'findings ·', (window.SYN_SUMMARY||{}).scanned, 'claims scanned');
})();
</script>
